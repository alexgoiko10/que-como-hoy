function shopList(){
  const need={};
  S.plan.slots.forEach(s=>{ if(s.on&&s.rid&&!s.done) REC[s.rid].ings.forEach(k=>{ if(!has(k)) (need[k]=need[k]||[]).push(REC[s.rid].name) }) });
  (S.shopExtra||[]).forEach(x=>{ if(!has(x.k)) (need[x.k]=need[x.k]||[]).push(x.why) });
  return need;
}
const eur=n=>n.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const mercaUrl=k=>"https://tienda.mercadona.es/search-results?query="+encodeURIComponent(ingName(k).replace(/\s*\(.*\)/,""));
function renderCompra(){
  const need=shopList(), keys=Object.keys(need);
  const byG={}; keys.forEach(k=>{const g=ING[k][1];(byG[g]=byG[g]||[]).push(k)});
  const priced=keys.filter(k=>S.prices[k]>0), total=priced.reduce((a,k)=>a+S.prices[k],0);
  const item=k=>`<li>
    <input type="checkbox" id="sh-${k}" data-buy="${k}" aria-label="Comprado: ${esc(ingName(k))}">
    <label for="sh-${k}"><b>${esc(ingName(k))}</b><br><span class="small muted">${esc([...new Set(need[k])].join(", "))}</span></label>
    <div class="price"><input type="number" inputmode="decimal" min="0" step="0.05" id="pr-${k}" data-price="${k}" value="${S.prices[k]||""}" placeholder="€" aria-label="Precio de ${esc(ingName(k))}"><a class="small" href="${mercaUrl(k)}" target="_blank" rel="noopener">Ver en Mercadona</a></div>
  </li>`;
  document.getElementById("view").innerHTML=`
    <section class="block">
      <div class="row between"><div><h2>Lista de la compra</h2><p class="small muted" style="margin:2px 0 0">Lo que te falta para el plan y las recetas especiales que añadas. Al marcarlo pasa a tu despensa.</p></div>
      ${keys.length?`<button class="btn" data-act="copy">Copiar lista</button>`:""}</div>
      ${keys.length?`<div class="total"><div><span class="label">Total estimado</span><b>${eur(total)}</b></div><span class="small muted">${priced.length} de ${keys.length} productos con precio. Escribe el precio una vez y se recuerda para las próximas semanas.</span></div>`:""}
      ${!keys.length&&!S.plan.slots.some(s=>s.rid)?`<p class="note">Primero genera el plan en la pestaña <b>Semana</b>, o añade una receta especial.</p>`:
        !keys.length?`<p class="note">Tienes todo lo necesario para el plan de esta semana.</p>`:
        Object.entries(GROUPS).filter(([g])=>byG[g]).map(([g,label])=>`<div class="stack" style="gap:6px"><span class="label">${label}</span><ul class="shop">${byG[g].map(item).join("")}</ul></div>`).join("")}
    </section>`;
}

/* ---------- Pestaña HISTORIAL ---------- */
function renderHistorial(){
  const byDay={}; S.history.slice().reverse().forEach((h,ri)=>{const idx=S.history.length-1-ri;(byDay[h.d]=byDay[h.d]||[]).push([h,idx])});
  const days=Object.keys(byDay).slice(0,21);
  // pasta por semana (últimas 4)
  const ws=weekStart(); const weeks=[3,2,1,0].map(n=>{const a=iso(addDays(ws,-7*n)),b=iso(addDays(ws,-7*n+7));const w=S.history.filter(h=>h.d>=a&&h.d<b);return {label:n===0?"Esta semana":`Hace ${n} sem.`,pasta:w.filter(h=>h.cat==="pasta").length,total:w.length}});
  const since=iso(addDays(new Date(),-30)); const month=S.history.filter(h=>h.d>=since);
  const counts=Object.keys(CATS).map(c=>[c,month.filter(h=>h.cat===c).length]).sort((a,b)=>b[1]-a[1]);
  const maxC=Math.max(1,...counts.map(c=>c[1])), maxW=Math.max(1,...weeks.map(w=>w.total));
  const opts=Object.values(REC).sort((a,b)=>a.name.localeCompare(b.name,"es")).map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("");
  document.getElementById("view").innerHTML=`
    <section class="block">
      <h2>Apuntar lo que has comido</h2>
      <form class="form" id="histForm">
        <select id="hRec" aria-label="Plato"><option value="">Elige un plato…</option>${opts}<option value="__otro">Otro (escribirlo)</option></select>
        <input type="text" id="hName" placeholder="Nombre del plato" hidden>
        <select id="hCat" aria-label="Tipo" hidden>${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select>
        <select id="hMeal" aria-label="Comida o cena"><option value="comida" ${mealNow==="comida"?"selected":""}>Comida</option><option value="cena" ${mealNow==="cena"?"selected":""}>Cena</option></select>
        <input type="date" id="hDate" value="${todayIso()}" aria-label="Fecha">
        <button class="btn primary" type="submit">Apuntar</button>
      </form>
    </section>
    <div class="two">
      <section class="block"><h2>Variedad del último mes</h2>
        ${month.length?`<div class="bars">${counts.map(([c,n])=>`<div class="bar" style="--dot:var(--c-${c})"><span>${CATS[c]}</span><div class="t"><span style="width:${n/maxC*100}%"></span></div><b>${n}</b></div>`).join("")}</div>`:`<p class="small muted">Cuando apuntes platos verás aquí qué tipos repites más.</p>`}
      </section>
      <section class="block"><h2>Pasta por semana</h2>
        <div class="bars">${weeks.map(w=>`<div class="bar" style="--dot:var(--c-pasta)"><span>${w.label}</span><div class="t"><span style="width:${w.pasta/maxW*100}%"></span></div><b>${w.pasta}/${w.total}</b></div>`).join("")}</div>
        <p class="small muted" style="margin:0">Platos de pasta sobre el total apuntado. Tu objetivo: ${S.settings.pastaMax} por semana.</p>
      </section>
    </div>
    <section class="block"><h2>Últimos días</h2>
      ${days.length?`<div class="hist">${days.map(d=>`<div class="hday"><span class="hl">${fmtDate(d)}</span><div class="stack" style="gap:4px">${byDay[d].map(([h,i])=>`<div class="hent">${catDot(h.cat)}<span>${esc(h.name)}</span><span class="small muted">${h.meal}</span><button class="ico" data-hdel="${i}" aria-label="Borrar">Borrar</button></div>`).join("")}</div></div>`).join("")}</div>`:`<p class="small muted">Aún no hay nada. Pulsa <b>Lo cocino</b> en cualquier plato o apúntalo arriba.</p>`}
    </section>
    ${STANDALONE?`<section class="block"><h2>Copia de seguridad</h2><p class="small muted" style="margin:0">Tus datos se guardan solo en este dispositivo. Descarga una copia de vez en cuando, o úsala para pasar tus datos a otro móvil u ordenador.</p>
      <div class="row"><button class="btn" data-act="export">Descargar copia</button><label class="btn" for="importFile">Cargar copia</label><input type="file" id="importFile" accept="application/json,.json" hidden></div></section>`:""}`;
}

/* ---------- Render general y eventos ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  ({hoy:renderHoy,especial:renderEspecial,semana:renderSemana,compra:renderCompra,historial:renderHistorial})[tab]();
  if(tab==="hoy") applySearch();
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;try{localStorage.setItem("qch-tab",tab)}catch(_){ }render();window.scrollTo(0,0)});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-buy]"); if(!t) return;
  const d=t.dataset;
  if(d.ing){ e.preventDefault(); const k=d.ing; S.pantry=has(k)?S.pantry.filter(x=>x!==k):[...S.pantry,k]; persist(); render(); return; }
  if(d.meal){ mealNow=d.meal; aiAll.hoy.items=null; render(); return; }
  if(d.rmcustom){ removeCustom(d.rmcustom); render(); return; }
  if(d.espf){ espFilter=d.espf; render(); return; }
  if(d.espv){ espView=d.espv; render(); return; }  if(d.redit){ editId=d.redit; formOpen=true; render(); document.getElementById("recipeForm")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(d.rdel){ const r=REC[d.rdel]; if(!confirm(`¿Borrar «${r.name}» de tus recetas?`)) return; S.myRecipes=S.myRecipes.filter(x=>x.id!==d.rdel); if(editId===d.rdel){editId=null;formOpen=false} syncMine(); persist(); toast("Receta borrada"); render(); return; }
  if(d.ai){ askAI(d.ai); return; }
  if(d.toplan){ const i=+document.getElementById("slotSel-"+d.toplan).value, s=S.plan.slots[i]; Object.assign(s,{on:true,rid:d.toplan,lock:true,done:false}); persist(); toast(`${REC[d.toplan].name}: ${DAYS[s.day].toLowerCase()} ${s.meal}`); render(); return; }
  if(d.tobuy){ const r=REC[d.tobuy], miss=r.ings.filter(k=>!has(k)); S.shopExtra=(S.shopExtra||[]).filter(x=>x.why!==r.name).concat(miss.map(k=>({k,why:r.name}))); persist(); toast(miss.length?`${miss.length} ingredientes a la lista`:"Ya lo tienes todo"); return; }
  if(d.cook){ const r=REC[d.cook]; logMeal({rid:r.id,name:r.name,cat:r.cat}); markPlanDone(r.id); toast(`Apuntado: ${r.name}`); render(); return; }
  if(d.aicook!=null){ const [kind,ix]=d.aicook.split(":"); const it=aiAll[kind].items[+ix]; logMeal({name:it.nombre,cat:CATS[it.categoria]?it.categoria:"verdura"}); toast(`Apuntado: ${it.nombre}`); render(); return; }
  if(d.hdel!=null){ S.history.splice(+d.hdel,1); persist(); render(); return; }
  if(d.slotOn!=null){ S.plan.slots[+d.slotOn].on=true; generate(+d.slotOn); render(); return; }
  if(d.slotOff!=null){ const s=S.plan.slots[+d.slotOff]; s.on=false; s.rid=null; s.lock=false; persist(); render(); return; }
  if(d.slotSwap!=null){ S.plan.slots[+d.slotSwap].lock=false; generate(+d.slotSwap); render(); return; }
  if(d.slotLock!=null){ const s=S.plan.slots[+d.slotLock]; s.lock=!s.lock; persist(); render(); return; }
  if(d.slotDone!=null){ const i=+d.slotDone, s=S.plan.slots[i], r=REC[s.rid]; s.done=true; S.history.push({d:iso(addDays(planWeekStart(),s.day)),meal:s.meal,rid:r.id,name:r.name,cat:r.cat}); S.history.sort((a,b)=>a.d.localeCompare(b.d)); persist(); toast(`Apuntado: ${r.name}`); render(); return; }
  switch(d.act){
    case "more": showAll=!showAll; render(); break;
    case "rform-new": editId=null; formOpen=true; render(); document.getElementById("rfName")?.focus(); break;
    case "rform-cancel": editId=null; formOpen=false; render(); break;
    case "clear-pantry": S.pantry=[]; persist(); render(); break;
    case "gen": generate(); render(); toast("Semana generada"); break;
    case "ai-stop": aiCtl?.abort(); break;
    case "copy": copyList(); break;
    case "export": { const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`que-como-hoy-${todayIso()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); toast("Copia descargada"); break; }
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.price){ const v=parseFloat(String(t.value).replace(",",".")); if(v>0) S.prices[t.dataset.price]=Math.round(v*100)/100; else delete S.prices[t.dataset.price]; persist(); render(); return; }
  if(t.dataset.buy){ const k=t.dataset.buy; if(!has(k)) S.pantry.push(k); S.shopExtra=(S.shopExtra||[]).filter(x=>x.k!==k); persist(); toast(`${ingName(k)} a la despensa`); setTimeout(render,250); }
  if(t.id==="importFile"&&t.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||!Array.isArray(d.pantry)) throw 0; S=Object.assign(defaults(),d); syncCustom(); syncMine(); persist(); render(); toast("Copia cargada"); }catch(_){ toast("Ese archivo no es una copia válida"); } }; fr.readAsText(t.files[0]); return; }
  if(t.id==="hoyMode"){ hoyMode=t.value; showAll=false; render(); }
  if(t.id==="pastaMax"){ S.settings.pastaMax=+t.value; persist(); render(); }
  if(t.id==="hRec"){ const o=t.value==="__otro"; document.getElementById("hName").hidden=!o; document.getElementById("hCat").hidden=!o; }
});
let pq="";
document.addEventListener("input",e=>{ if(e.target.id!=="pSearch") return; pq=e.target.value; applySearch(); if(pq) document.getElementById("newIng").value=pq; });
function applySearch(){
  if(!document.getElementById("pSearch")) return;
  const q=norm(pq); let any=false;
  document.querySelectorAll("#pantry .chip").forEach(c=>{const ok=!q||norm(c.textContent.replace("✓","")).includes(q); (c.closest(".mchip")||c).hidden=!ok; if(ok&&q)any=true;});
  document.querySelectorAll("#pantry .stack").forEach(g=>{g.hidden=!!q&&![...g.querySelectorAll(".chip")].some(c=>!(c.closest(".mchip")||c).hidden)});
  const sub=document.getElementById("pantryEsp"); if(q&&sub&&[...sub.querySelectorAll(".chip")].some(c=>!c.hidden)) sub.open=true;
  document.getElementById("noRes").hidden=!q||any;
}
document.addEventListener("submit",e=>{
  if(e.target.id==="addIng"){ e.preventDefault(); pq=""; const v=document.getElementById("newIng").value; addCustom(v); render(); document.getElementById("pantry").open=true; return; }
  if(e.target.id==="recipeForm"){ e.preventDefault(); saveRecipe(); return; }
  if(e.target.id!=="histForm") return; e.preventDefault();
  const v=document.getElementById("hRec").value; if(!v) return toast("Elige un plato");
  const meal=document.getElementById("hMeal").value, dte=document.getElementById("hDate").value||todayIso();
  let entry;
  if(v==="__otro"){ const n=document.getElementById("hName").value.trim(); if(!n) return toast("Escribe el nombre"); entry={name:n,cat:document.getElementById("hCat").value}; }
  else { const r=REC[v]; entry={rid:r.id,name:r.name,cat:r.cat}; }
  S.history.push(Object.assign({d:dte,meal},entry)); S.history.sort((a,b)=>a.d.localeCompare(b.d)); persist(); toast(`Apuntado: ${entry.name}`); render();
});
function markPlanDone(rid){ const s=S.plan.slots.find(x=>x.rid===rid&&!x.done); if(s) s.done=true; }
async function copyList(){
  const need=shopList(); const ks=Object.keys(need), tot=ks.reduce((a,k)=>a+(S.prices[k]||0),0); const txt="Lista de la compra\n"+ks.map(k=>"- "+ingName(k)+(S.prices[k]?" ("+eur(S.prices[k])+")":"")).join("\n")+(tot?"\nTotal estimado: "+eur(tot):"");
  try{ await navigator.clipboard.writeText(txt); toast("Lista copiada"); }
  catch(_){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("Lista copiada")}catch(__){toast("Selecciona y copia a mano")} ta.remove(); }
}

try{ const t=localStorage.getItem("qch-tab"); if(t&&["hoy","especial","semana","compra","historial"].includes(t)) tab=t; }catch(_){}
render();

/* ---------- Capacidades: guardado en la cuenta e ideas con Claude ---------- */
(async()=>{
  if(!window.claude?.use) return;
  claude.use("sample").then(fn=>{ if(fn){ sampleFn=fn; document.querySelectorAll(".aiBlock").forEach(b=>b.hidden=false); } });
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc("data/users/"+id+"/state");
    const snap=await dbRef.get();
    if(snap.exists){ S=Object.assign(defaults(),JSON.parse(JSON.stringify(snap.data()))); S.prices=S.prices||{}; S.shopExtra=S.shopExtra||[]; syncCustom(); syncMine(); try{localStorage.setItem("qch-state",JSON.stringify(S))}catch(_){ } render(); setSync("Guardado en tu cuenta"); }
    else if(!S.example){ flush(); } else setSync("Se guardará en tu cuenta al hacer cambios");
  }catch(e){ dbRef=null; }
})();
</script>

if("serviceWorker" in navigator && location.protocol==="https:"){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
