<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>¿Qué como hoy?</title>
<meta name="description" content="Qué cocinar con lo que tienes, plan semanal, recetas especiales y lista de la compra.">
<meta name="theme-color" content="#E8402A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Qué como">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<style>
/* Formato por tarjetas: portada con 4 tarjetas grandes a dos colores; cada una abre su pantalla con una cabecera en sus mismos colores */
:root{
  --tomate:#E8402A; --hielo:#BFE2EE; --mostaza:#F2B33D; --berenjena:#3B2140; --albahaca:#1E7B4F; --lima:#D4E86A; --kraft:#C9935A; --tinta:#1F3A6B;
  --bg:#E4E7EB; --surface:#FFFFFF; --sunk:#EEF0F3; --ink:#20232A; --muted:#5D636E; --line:#D5DAE0;
  --warn:#B4361F; --ok:#1E7B4F;
  --acc:var(--ink); --acc-ink:#FFFFFF;
  --c-pollo:#D9A23A; --c-carne:#B8503B; --c-huevo:#E6C84A; --c-legumbre:#8C6A3F; --c-pescado:#3E86B5; --c-pasta:#D9772B; --c-arroz:#9AA3A0; --c-verdura:#4E9A55; --c-postre:#A0527A; --c-snack:#7A6FC2;
  --f:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#23262D; --surface:#2E323B; --sunk:#292D35; --ink:#ECEEF1; --muted:#A3A9B4; --line:#3E434E; --warn:#FF8A70; --ok:#7FD1A4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#23262D; --surface:#2E323B; --sunk:#292D35; --ink:#ECEEF1; --muted:#A3A9B4; --line:#3E434E; --warn:#FF8A70; --ok:#7FD1A4; color-scheme:dark}
/* Color de acción de cada pantalla */
body[data-sec="nevera"]{--acc:var(--tomate);--acc-ink:#FFFFFF}
body[data-sec="recetas"]{--acc:var(--berenjena);--acc-ink:#FFFFFF}
body[data-sec="menu"]{--acc:var(--albahaca);--acc-ink:#FFFFFF}
body[data-sec="compra"]{--acc:var(--tinta);--acc-ink:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body[data-sec="recetas"]{--acc:var(--mostaza);--acc-ink:#20232A}
  :root:not([data-theme="light"]) body[data-sec="compra"]{--acc:#86A9E6;--acc-ink:#14213D}
  :root:not([data-theme="light"]) body[data-sec="menu"]{--acc:#4CC28A;--acc-ink:#0E2A1C}}
:root[data-theme="dark"] body[data-sec="recetas"]{--acc:var(--mostaza);--acc-ink:#20232A}
:root[data-theme="dark"] body[data-sec="compra"]{--acc:#86A9E6;--acc-ink:#14213D}
:root[data-theme="dark"] body[data-sec="menu"]{--acc:#4CC28A;--acc-ink:#0E2A1C}
:root{--acc-soft:color-mix(in srgb,var(--acc) 14%,var(--surface))}
body{--acc-soft:color-mix(in srgb,var(--acc) 14%,var(--surface))}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.label{font-size:13px;font-weight:700;color:var(--muted)}
/* Titulares: Archivo muy estrecha, negra y en cursiva, como un cartel */
.disp{font-stretch:62%;font-weight:900;font-style:italic;line-height:.86;letter-spacing:-.005em}
.h2{font-stretch:75%;font-weight:800;font-size:27px;line-height:1}
h3{font-stretch:82%;font-weight:800;font-size:19px;line-height:1.15}

/* ---------- Portada ---------- */
.home{max-width:760px;margin:0 auto;padding:18px 16px 36px}
.home-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 4px 16px}
.home-top h1{font-size:34px}
.tile{position:relative;display:block;border-radius:28px;overflow:hidden;min-height:218px;margin-bottom:14px;text-decoration:none;color:var(--ink);isolation:isolate;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.985)}
.tile .wm,.band .wm{position:absolute;z-index:0;left:-.03em;bottom:-.2em;font-family:var(--f);font-stretch:62%;font-weight:900;font-style:italic;font-size:190px;line-height:1;color:rgba(255,255,255,.17);white-space:nowrap;pointer-events:none}
.tile h2{position:absolute;z-index:2;font-size:clamp(54px,15vw,78px)}
.tile .stat{position:absolute;z-index:2;font-weight:700;font-size:14px;line-height:1.25;max-width:46%}
.tile .art{position:absolute;z-index:1;pointer-events:none}

.t-nevera{background:linear-gradient(90deg,var(--hielo) 46%,var(--tomate) 46%)}
.t-nevera .art{left:2%;bottom:-6%;width:44%;max-width:230px}
.t-nevera h2{font-size:clamp(50px,13.5vw,74px);right:18px;bottom:18px;color:#FFFFFF;text-align:right}
.t-nevera .stat{right:18px;top:18px;color:#FFFFFF;text-align:right;max-width:48%}

.t-recetas{background:linear-gradient(180deg,var(--mostaza) 54%,var(--berenjena) 54%)}
.t-recetas .art{right:-4%;top:-10%;width:58%;max-width:320px}
.t-recetas h2{left:18px;bottom:18px;color:var(--mostaza)}
.t-recetas .stat{left:18px;top:18px;color:var(--ink)}

.t-menu{background:linear-gradient(162deg,var(--albahaca) 57%,var(--lima) 57%)}
.t-menu h2{left:18px;top:20px;color:var(--lima)}
.t-menu .stat{right:18px;top:20px;color:#FFFFFF;text-align:right}
.t-menu .week{position:absolute;z-index:2;left:18px;right:18px;bottom:16px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week span{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:14px;color:#20232A}
.week i{display:block;width:100%;height:6px;border-radius:3px;background:rgba(32,35,42,.18)}
.week i.ex{background:var(--albahaca)}
.week span.today{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}

.t-compra{background:linear-gradient(90deg,var(--tinta) 58%,var(--kraft) 58%)}
.t-compra .art{right:1%;bottom:-4%;width:40%;max-width:200px}
.t-compra h2{left:18px;bottom:18px;color:#FFFFFF}
.t-compra .stat{left:18px;top:18px;color:#FFFFFF}

.home-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 4px 0;font-size:13.5px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:6px 0;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:13.5px;cursor:pointer}

/* ---------- Cabecera de cada pantalla ---------- */
.band{position:relative;overflow:hidden;isolation:isolate;min-height:178px;border-radius:0 0 28px 28px;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px;display:flex;align-items:flex-end}
.band h1{position:relative;z-index:2;font-size:clamp(52px,14vw,84px);max-width:66%}
.band .art{position:absolute;z-index:1;right:2%;bottom:-8%;width:30%;max-width:190px;pointer-events:none}
.b-nevera{background:linear-gradient(90deg,var(--tomate) 68%,var(--hielo) 68%)} .b-nevera h1{color:#FFFFFF}
.b-recetas{background:linear-gradient(90deg,var(--berenjena) 68%,var(--mostaza) 68%)} .b-recetas h1{color:var(--mostaza)}
.b-menu{background:linear-gradient(90deg,var(--albahaca) 68%,var(--lima) 68%)} .b-menu h1{color:var(--lima)}
.b-compra{background:linear-gradient(90deg,var(--tinta) 68%,var(--kraft) 68%)} .b-compra h1{color:#FFFFFF}
.b-recetas .art{bottom:auto;top:16%;width:34%}
.b-menu .art{bottom:22%}

.page{max-width:760px;margin:0 auto;padding:20px 16px 116px;display:flex;flex-direction:column;gap:26px}
.back{position:fixed;z-index:15;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px 0 16px;border-radius:999px;border:0;background:#1E2026;color:#FFFFFF;font-weight:800;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.back svg{width:18px;height:18px}

/* ---------- Piezas comunes ---------- */
section.block{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.head p{margin:4px 0 0}
.panel{background:var(--surface);border-radius:22px;padding:18px}
.sels{display:grid!important;grid-template-columns:1fr 1fr}
.sels select{min-width:0;width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn[aria-pressed="true"]{background:var(--acc-soft);border-color:var(--acc)}
select.btn{padding-right:12px}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--sunk);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:none;white-space:nowrap;border:0;background:transparent;padding:6px 11px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.note{font-size:14px;background:var(--acc-soft);border-radius:14px;padding:10px 14px;margin:0}
.chev{display:inline-block;width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:translateY(-2px) rotate(45deg);flex:none}
details[open]>summary .chev{transform:translateY(1px) rotate(-135deg)}
@media (prefers-reduced-motion:no-preference){.chev{transition:transform .2s}}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
input[type=search],input[type=text],input[type=number],input:not([type]){border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 13px;min-width:0}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--muted)}
.cat i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--dot)}
.tag{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn)}
.tag.new{background:var(--acc-soft);color:var(--ink)}
.tip{font-size:14px;background:var(--sunk);border-radius:12px;padding:9px 13px;margin:10px 0 0}
.miss{color:var(--warn);font-weight:600}
.okk{color:var(--ok);font-weight:600}

/* ---------- Nevera ---------- */
.fridge{background:color-mix(in srgb,var(--hielo) 55%,var(--surface));border-radius:24px;padding:18px}
.fridge>summary{cursor:pointer;display:flex;flex-direction:column;gap:12px}
.fridge .fhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stickers{display:flex;flex-wrap:wrap;gap:6px}
.sticker{background:var(--tomate);color:#FFFFFF;border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:700}
.sticker.more{background:transparent;color:var(--ink);border:1.5px solid currentColor}
.fridge[open] .stickers,.fridge[open] .c,.fridge:not([open]) .o{display:none}
.padd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.padd input{width:100%;border-radius:999px}
#addIng input{flex:1}
.nores{margin:10px 0 0}
.pgroups{display:flex;flex-direction:column;margin-top:10px}
/* Cada grupo es una balda: etiqueta, ingredientes y el canto de la balda debajo */
.pg{padding:12px 2px 10px;border-bottom:5px solid color-mix(in srgb,var(--hielo) 80%,var(--ink) 8%)}
.pg>summary{cursor:pointer;display:flex;align-items:center;gap:10px;min-height:30px}
.pg>summary .pgt{flex:1;font-stretch:80%;font-weight:800;font-size:17px}
.pg .chips{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.mchip{display:inline-flex;align-items:center}
.mchip .chip{border-top-right-radius:0;border-bottom-right-radius:0}
.mchip .x{border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent);border-left:0;background:transparent;color:var(--muted);border-radius:0 999px 999px 0;padding:6px 10px;font-size:14px;line-height:1.3}

/* Platos en lista */
.dishes{background:var(--surface);border-radius:22px;overflow:hidden}
.dish+.dish{border-top:1.5px solid var(--sunk)}
.dish>summary{cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:3px 14px;align-items:center;padding:14px 18px}
.dish .dn{font-stretch:80%;font-weight:800;font-size:19px;line-height:1.15}
.dish .dm{font-size:14px;color:var(--muted);grid-column:1}
.dish .dt{grid-column:2;grid-row:1/3;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;align-items:center;gap:10px}
.dish[open]>summary{background:var(--acc-soft)}
.dish .body{padding:4px 18px 18px;display:flex;flex-direction:column;gap:10px}
.dish ol,.card ol{margin:0;padding-left:20px;font-size:15px}
.dish ol li+li,.card ol li+li{margin-top:4px}
.ings{display:flex;flex-wrap:wrap;gap:4px}
.ing{font-size:13px;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--ink)}
.ing.miss{background:transparent;border:1.5px dashed color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn);font-weight:500}
.ing .q{font-weight:700;font-variant-numeric:tabular-nums}
.serv{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;margin:0 0 8px}
.serv .stp{display:flex;gap:6px;flex:none}
.serv .ico{width:34px;height:30px;padding:0;font-size:17px;line-height:1;color:var(--ink)}
.serv .ico:disabled{opacity:.35}
.sq{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Recetas en tarjetas ---------- */
.rg{background:var(--surface);border-radius:22px}
.rg+.rg{margin-top:10px}
.rg>summary{cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px 18px}
.rg>summary .h2{flex:1}
.rg>.cards{padding:0 12px 12px}
.rsearch{width:100%;max-width:420px;border-radius:999px!important}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:9px;min-width:0;border:1.5px solid var(--sunk)}
.rg .card{background:var(--sunk);border-color:transparent}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13.5px;color:var(--muted)}
.card details>summary{cursor:pointer;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.card details[open]>summary{margin-bottom:8px}
.card .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ai{display:flex;flex-direction:column;gap:12px}
.ai input{flex:1;min-width:180px;border-radius:999px}

/* ---------- Menú semanal ---------- */
.ex{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.exd{border:0;border-radius:16px;background:var(--sunk);padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:800;min-width:0}
.exd.on{background:var(--lima);color:#20232A}
.exd .lv{display:flex;align-items:flex-end;gap:2px;height:22px}
.exd .lv i{width:4px;border-radius:2px;background:color-mix(in srgb,currentColor 22%,transparent)}
.exd .lv i.f{background:currentColor}
.exd small{font-size:11.5px;font-weight:700;opacity:.8}
.body-in{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.body-in label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.body-in input{width:84px;text-align:right;font-variant-numeric:tabular-nums}
.target{font-size:14px;color:var(--muted);margin:0}
.target b{color:var(--ink)}
.must{display:flex;flex-wrap:wrap;gap:6px}
.mustc{display:inline-flex;align-items:center;gap:4px;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:5px 6px 5px 13px;font-weight:700;font-size:14px}
.mustc button{border:0;background:rgba(255,255,255,.22);color:inherit;border-radius:50%;width:24px;height:24px;line-height:1;font-size:15px}
#mustForm input{flex:1}
.plan{display:flex;flex-direction:column;background:var(--surface);border-radius:22px;overflow:hidden}
.pday{display:grid;grid-template-columns:96px 1fr 1fr;border-top:1.5px solid var(--sunk)}
.pday:first-child{border-top:0}
.pday.today{box-shadow:inset 5px 0 0 var(--acc)}
.pday .dl{padding:12px 12px 12px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.pday .dl b{font-stretch:75%;font-weight:900;font-style:italic;font-size:24px;line-height:1}
.pday .por{grid-column:1/-1;padding:0 16px 12px;font-size:13px;color:var(--muted)}
.pday .por b{color:var(--ink)}
.slot{padding:12px;border-left:1.5px solid var(--sunk);display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .sname{font-weight:700;font-size:15px;line-height:1.25}
.slot.off{color:var(--muted)}
.slot.done .sname{text-decoration:line-through;color:var(--muted)}
.slot .acts{display:flex;flex-wrap:wrap;gap:4px}
.ico{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.ico[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mtag{font-size:11.5px;font-weight:800;color:var(--acc)}
@media (max-width:560px){
  .pday{grid-template-columns:1fr 1fr}
  .pday .dl{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:10px;align-items:baseline;padding:12px 16px 2px}
  .slot{border-left:0}
  .slot + .slot{border-left:1.5px solid var(--sunk)}
}

/* ---------- Compra ---------- */
.shop{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:22px;overflow:hidden}
.shop li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1.5px solid var(--sunk)}
.shop li:first-child{border-top:0}
.shop input[type=checkbox]{margin-top:3px;width:20px;height:20px;flex:none;accent-color:var(--acc)}
.shop label{flex:1;min-width:0;cursor:pointer}
.price{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.price input{width:84px;height:36px;border-radius:10px;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums}
.price a{color:var(--acc);font-weight:700;white-space:nowrap}
.total{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;background:var(--kraft);color:#20232A;border-radius:22px;padding:16px 18px}
.total>div{display:flex;flex-direction:column}
.total b{font-stretch:62%;font-weight:900;font-style:italic;font-size:44px;line-height:.9;font-variant-numeric:tabular-nums}
.total .small{color:#3A2C1C}

/* ---------- Mis recetas: formulario ---------- */
.rform{background:var(--surface);border-radius:22px;padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rform .full{grid-column:1/-1}
.rform label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--muted)}
.rform label i{font-style:normal;font-weight:400}
.rform label .small{font-weight:400}

/* Al abrir una tarjeta, crece hasta ser la cabecera de su pantalla */

  ::view-transition-group(*){animation-duration:.32s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
}
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
}

}

 ["s31","Pimientos rellenos de carne al horno","carne","f",60,["pimiento","picada","arroz","cebolla","frito","rallado"],["Cuece el arroz 10 min (queda a medias).","Sofríe cebolla y carne, añade tomate y el arroz.","Rellena los pimientos vaciados y ponles su tapa.","Horno a 190 °C 35 min; queso los últimos 5."],"Hazlos con pimientos de colores: rojos, amarillos y verdes."],
 ["s32","Quiche de bacon y puerro","huevo","f",55,["hojaldre","bacon","puerro","huevos","nata","rallado"],["Forra un molde con la masa y pínchala.","Pocha el puerro y dora el bacon.","Mezcla 3 huevos, 200 ml de nata, queso, sal y nuez moscada; añade puerro y bacon.","Rellena y horno a 180 °C 30-35 min."],"Está buena caliente y fría: sirve para un picnic."],
 ["s33","Crema de calabaza con queso de cabra","verdura","p",40,["calabaza","cebolla","qcabra","nueces","nata"],["Pocha la cebolla y añade la calabaza en dados, 5 min.","Cubre de agua o caldo y cuece 20 min.","Tritura con un chorro de nata.","Sirve con rodajas de rulo de cabra gratinado y nueces."],"Un hilo de miel sobre el queso de cabra lo hace de restaurante."],
 ["s34","Tarta de queso cremosa","postre","f",60,["qcrema","nata","huevos","azucar","harina"],["Horno a 210 °C. Forra un molde con papel de horno arrugado.","Bate 500 g de queso crema, 200 g de azúcar, 4 huevos, 250 ml de nata y 1 cucharada de harina.","Hornea 35-40 min: tiene que quedar dorada por fuera y temblorosa en el centro.","Deja enfriar a temperatura ambiente y luego nevera."],"Mejor al día siguiente. El centro cremoso es lo que la hace especial."],
 ["s35","Brownie de chocolate y nueces","postre","f",40,["chocolate","mantequilla","huevos","azucar","harina","nueces"],["Funde 150 g chocolate con 120 g mantequilla.","Bate 3 huevos con 150 g azúcar y mezcla con el chocolate.","Añade 70 g harina y las nueces troceadas.","Horno a 180 °C 20-25 min: el centro debe quedar algo húmedo."],"Sírvelo templado con una bola de helado de vainilla."],
 ["s36","Torrijas","postre","f",30,["pan","leche","huevos","azucar"],["Infusiona la leche con canela y piel de limón y azúcar, 5 min.","Empapa rebanadas gruesas de pan del día anterior.","Pásalas por huevo batido y fríelas en aceite caliente.","Rebózalas en azúcar con canela."],"Aunque sean de Semana Santa, en otoño con un café saben igual de bien."],
 ["s37","Arroz con leche","postre","f",50,["arroz","leche","azucar","limon"],["1 litro de leche con canela en rama y piel de limón. Que hierva.","Añade 100 g de arroz y cuece 35-40 min a fuego suave, removiendo a menudo.","Los últimos 5 min, 80 g de azúcar.","Enfría y espolvorea canela."],"Sírvelo en cuencos de barro."],
 ["s38","Mousse de chocolate","postre","p",20,["chocolate","huevos","azucar"],["Funde 100 g de chocolate y deja templar.","Mezcla con 3 yemas.","Monta las 3 claras a punto de nieve con 30 g de azúcar e incorpóralas con cuidado.","Reparte en vasos y nevera 3 h."],"Unas escamas de sal por encima: contraste que sorprende."],
 ["s39","Solomillo al whisky","carne","pf",30,["solomillo","ajo","caldo","patatas"],["Patatas fritas en dados o gajos.","Solomillo en medallones, dorado 2 min por lado y sácalo.","Dora 6 ajos laminados, añade un chorro de whisky (o vino), el zumo de medio limón y el caldo; reduce 5 min.","Vuelve la carne 1 min a la salsa."],"Con pan para mojar: la salsa es lo mejor."],

 ["r81","Brochetas de pollo con salsa de yogur","pollo","n",20,["pollo","yogur","pepino","ajo"],["Marina el pollo en dados 5 min con pimentón, comino, sal y un poco de yogur.","Plancha 8-10 min dándoles la vuelta.","Salsa: yogur, pepino rallado, ajo picado y sal."]],
 ["r82","Pollo con champiñones y nata","pollo","n",15,["pollo","champis","nata","ajo"],["Dora el pollo en tiras y sácalo.","Saltea los champiñones laminados con ajo.","Vuelve el pollo, añade la nata y 3 min a fuego suave."]],
 ["r83","Salteado de pollo con judías verdes","pollo","cn",15,["pollo","judias","ajo","soja"],["Judías (congeladas valen) al micro 5 min.","Saltea el pollo en tiras a fuego fuerte con ajo.","Añade las judías y un chorro de soja, 2 min más."]],
 ["r84","Pollo a la naranja con arroz","pollo","c",20,["pollo","naranja","soja","arroz"],["Cuece el arroz.","Dora el pollo en tacos.","Añade el zumo de 1 naranja y un chorrito de soja; reduce 3 min hasta que espese."]],
 ["r85","Nuggets caseros de pollo con ensalada","pollo","cn",20,["pollo","huevos","pan_rallado","lechuga"],["Corta el pollo en trozos y sálalo.","Pásalo por huevo batido y pan rallado.","Fríe en 1 dedo de aceite 3-4 min o al horno a 220 °C 12 min. Con ensalada."]],
 ["r86","Pollo encebollado con pimientos","pollo","n",20,["pollo","cebolla","pimiento"],["Pocha cebolla y pimiento en tiras 10 min a fuego medio.","Sube el fuego y añade el pollo en tiras con sal y pimentón.","5 min más hasta que esté dorado."]],
 ["r87","Ensalada de pollo, mango y aguacate","pollo","n",10,["pollo","mango","aguacate","lechuga","lima"],["Pollo a la plancha en dados.","Mango y aguacate en dados.","Mezcla sobre la lechuga y aliña con lima, aceite y sal."]],
 ["r88","Sándwich de pollo, queso y tomate","pollo","n",10,["pan_molde","pollo","queso","tomate","lechuga"],["Filete de pollo fino a la plancha.","Tuesta el pan con el queso encima para que se funda.","Monta con pollo, tomate y lechuga."]],
 ["r89","Pollo tikka con arroz","pollo","c",20,["pollo","yogur","curry","triturado","arroz"],["Cuece el arroz.","Mezcla el pollo en dados con yogur y curry y dóralo en la sartén.","Añade el tomate, 8 min a fuego suave, y sirve con el arroz."]],
 ["r90","Pollo con calabacín y queso fresco","pollo","n",15,["pollo","calabacin","qfresco"],["Calabacín en medias lunas a la plancha con sal.","Pollo en dados a la plancha.","Mezcla con el queso fresco en dados y orégano."]],
 ["r91","Quesadillas de pollo y maíz","pollo","n",15,["tortillas","pollo","maiz","queso"],["Pollo a la plancha en tiras con comino.","Rellena media tortilla con queso, pollo y maíz, y dóblala.","Dora por los dos lados en la sartén."]],
 ["r92","Pollo con garbanzos y espinacas","pollo","c",15,["pollo","garbanzos","espinacas","ajo"],["Dora el pollo en tacos con ajo y pimentón.","Añade los garbanzos escurridos, 3 min.","Echa las espinacas hasta que bajen."]],
 ["r93","Pollo al limón con cuscús","pollo","c",15,["pollo","limon","cuscus","ajo"],["Cuscús: mismo volumen de agua hirviendo, tapa 5 min.","Dora el pollo en tacos con ajo.","Riega con zumo de limón y ralladura, y sirve sobre el cuscús."]],
 ["r94","Pollo barbacoa con maíz y patatas","pollo","c",20,["pollo","barbacoa","maiz","patatas"],["Patatas en gajos al micro 8 min y luego a dorar.","Dora el pollo en tiras.","Añade la salsa barbacoa y el maíz, 2 min."]],
 ["r95","Pollo al curry con coliflor","pollo","c",20,["pollo","coliflor","curry","yogur"],["Coliflor en ramilletes al micro 5 min.","Dora el pollo en tacos con curry.","Añade la coliflor y, fuera del fuego, el yogur."]],
 ["r96","Burrito de pollo y alubias","pollo","cn",15,["tortillas","pollo","alubias","queso","tomate"],["Pollo en tiras salteado con comino y pimentón.","Calienta las alubias y aplástalas un poco.","Rellena la tortilla con todo, enrolla y dórala en la sartén."]],
 ["r97","Pollo con puerro y nata","pollo","n",15,["pollo","puerro","nata"],["Puerro en rodajas finas, pochado 5 min.","Añade el pollo en tiras y dóralo.","Nata, 3 min a fuego suave y pimienta."]],
 ["r98","Pollo con boniato y espinacas","pollo","c",20,["pollo","boniato","espinacas"],["Boniato en dados al micro 7 min, luego a dorar en la sartén.","Dora el pollo en tacos con pimentón.","Añade las espinacas hasta que bajen."]],
 ["r99","Bol de quinoa con pollo y calabacín","pollo","c",20,["quinoa","pollo","calabacin","limon"],["Lava y cuece la quinoa 12-15 min.","Pollo y calabacín en dados a la plancha.","Mezcla todo con limón y aceite."]],
 ["r100","Wrap de pollo, hummus y zanahoria","pollo","n",10,["tortillas","pollo","hummus","zanahoria","lechuga"],["Pollo a la plancha en tiras.","Extiende el hummus en la tortilla.","Añade pollo, zanahoria rallada y lechuga, y enrolla."]],
 ["r101","Pollo a la plancha con tzatziki","pollo","n",15,["pollo","griego","pepino","ajo"],["Pollo fileteado a la plancha con orégano.","Tzatziki: yogur griego, pepino rallado y escurrido, ajo, aceite y sal.","Sirve el pollo con la salsa por encima."]],
 ["r102","Sopa de fideos con pollo","pollo","n",20,["caldo","fideos","pollo","zanahoria"],["Calienta el caldo con la zanahoria en rodajas finas.","Añade el pollo en dados pequeños, 5 min.","Echa los fideos, 4-5 min según el paquete."]],
 ["r103","Pollo al wok con frutos secos","pollo","c",20,["pollo","frutos_secos","pimiento","soja","arroz"],["Cuece el arroz.","Saltea el pollo a fuego fuerte y luego el pimiento.","Añade frutos secos y soja, 1 min, y sirve con el arroz."]],
 ["r104","Pollo al chilindrón exprés","pollo","c",20,["pollo","pimiento","cebolla","triturado","jamon"],["Dora el pollo en tacos y sácalo.","Sofríe cebolla, pimiento y jamón en taquitos.","Añade el tomate y el pollo, 10 min a fuego suave."]],
 ["r105","Noodles de pollo con jengibre","pollo","c",15,["noodles","pollo","jengibre","soja","zanahoria"],["Cuece los noodles.","Saltea el pollo con jengibre rallado y la zanahoria en tiras.","Añade los noodles y la soja, 1 min más."]],
 ["r106","Ensalada templada de pollo y lentejas","pollo","n",15,["pollo","lentejas","cherry","cebolleta"],["Pollo a la plancha en dados.","Enjuaga las lentejas y calienta 1 min en la sartén.","Mezcla con cherry y cebolleta y aliña con aceite y vinagre."]],
 ["r107","Pollo al pimentón con patatas","pollo","c",20,["pollo","patatas","cebolla"],["Patatas y cebolla en láminas al micro 8 min con aceite y sal.","Dora el pollo en tacos con pimentón.","Junta todo en la sartén 3 min."]],
 ["r108","Pollo relleno de jamón y queso","pollo","cn",20,["pollo","jamon","queso","lechuga"],["Abre la pechuga en libro y rellena con jamón y queso.","Ciérrala con un palillo y dórala a fuego medio 5 min por lado, tapada.","Córtala en rodajas y sirve con ensalada."]],
 ["r109","Pollo con pisto rápido","pollo","c",20,["pollo","calabacin","pimiento","frito"],["Pocha pimiento y calabacín en dados pequeños.","Dora el pollo en tacos aparte.","Junta con el tomate frito, 5 min."]],
 ["r110","Salpicón de pollo","pollo","n",10,["pollo","pimiento","cebolla","tomate","vinagre"],["Pollo a la plancha (o el que te sobró) en dados.","Pica muy fino pimiento, cebolla y tomate.","Mezcla y aliña con aceite, vinagre y sal. Mejor frío."]],
 ["r111","Tiras de pollo picantes con salsa de yogur","pollo","n",15,["pollo","picante","mantequilla","griego","zanahoria"],["Dora el pollo en tiras.","Añade una nuez de mantequilla y salsa picante al gusto.","Sirve con yogur griego para mojar y palitos de zanahoria."]],
 ["r112","Kebab casero en tortilla","pollo","cn",15,["pollo","tortillas","lechuga","tomate","yogur"],["Pollo en tiras finas con comino, pimentón y ajo en polvo, a fuego fuerte.","Salsa: yogur, ajo, limón y sal.","Monta la tortilla con pollo, lechuga, tomate y salsa."]],
 ["r113","Tabulé con pollo","pollo","c",15,["cuscus","pollo","tomate","pepino","perejil","limon"],["Hidrata el cuscús 5 min y suéltalo con un tenedor.","Pollo a la plancha en dados.","Mezcla con tomate, pepino y perejil picados, limón y aceite."]],
 // Carne
 ["r114","Pavo con pimientos del piquillo","carne","n",15,["pavo","piquillo","ajo"],["Pavo en filetes finos a la plancha.","Saltea los piquillos en tiras con ajo laminado.","Sirve el pavo con los pimientos y su jugo."]],
 ["r115","Albóndigas exprés en salsa de tomate","carne","c",20,["picada","triturado","cebolla","pan_rallado"],["Mezcla la carne con pan rallado, sal y ajo en polvo; haz bolitas pequeñas.","Dóralas en la sartén y sácalas.","Sofríe la cebolla, añade tomate y albóndigas, 10 min."]],
 ["r116","Chili con carne","carne","c",20,["picada","alubias","triturado","cebolla","pimiento"],["Sofríe cebolla y pimiento.","Añade la carne con comino, pimentón y un poco de picante.","Tomate y alubias, 10 min a fuego suave."]],
 ["r117","Lomo a la mostaza con patatas","carne","c",20,["lomo","mostaza","nata","patatas"],["Patatas en rodajas al micro 8 min, luego a dorar.","Lomo a la plancha 1-2 min por lado.","En la misma sartén: mostaza y nata, 2 min, y napa el lomo."]],
 ["r118","Lomo al ajillo con champiñones","carne","n",15,["lomo","champis","ajo","perejil"],["Lomo en tiras dorado a fuego fuerte y sácalo.","Saltea los champiñones con ajo laminado.","Vuelve el lomo con perejil, 1 min."]],
 ["r119","Ternera con brócoli y soja","carne","c",20,["ternera","brocoli","soja","jengibre","arroz"],["Cuece el arroz.","Ternera en tiras finas a fuego muy fuerte, 2 min, y sácala.","Saltea el brócoli con jengibre, vuelve la carne y añade la soja."]],
 ["r120","Fajitas de ternera","carne","cn",15,["ternera","tortillas","pimiento","cebolla"],["Corta ternera, pimiento y cebolla en tiras.","Saltea fuerte con comino, pimentón y sal.","Rellena las tortillas calientes."]],
 ["r121","Filete de ternera con ensalada","carne","n",10,["ternera","lechuga","tomate","cebolla"],["Saca el filete 10 min antes de la nevera.","Plancha muy caliente, 1-2 min por lado; sal gorda al final.","Ensalada de lechuga, tomate y cebolla."]],
 ["r122","Pavo al curry con arroz","carne","c",20,["pavo","curry","nata","arroz"],["Cuece el arroz.","Dora el pavo en tacos con curry.","Añade la nata, 4 min, y sirve con el arroz."]],
 ["r123","Pavo a la plancha con puré de boniato","carne","n",20,["pavo","boniato","mantequilla"],["Boniato pelado en dados al micro 8-10 min y aplástalo con mantequilla y sal.","Pavo fino a la plancha.","Sirve juntos con pimienta."]],
 ["r124","Hamburguesa sin pan con calabacín","carne","n",15,["hamburguesas","calabacin","tomate"],["Calabacín en rodajas a la plancha.","Hamburguesa 3-4 min por lado.","Sirve con tomate en rodajas y orégano."]],
 ["r125","Salchichas con pimientos y cebolla","carne","cn",15,["salchichas","pimiento","cebolla"],["Pimiento y cebolla en tiras a fuego medio 8 min.","Añade las salchichas y dóralas.","Un chorrito de agua o vino y 2 min más."]],
 ["r126","Perritos con cebolla crujiente","carne","n",10,["salchichas","pan","ketchup","mostaza","cebolla"],["Dora las salchichas.","Cebolla muy fina frita hasta que esté crujiente.","Monta en el pan con ketchup y mostaza."]],
 ["r127","Salchichas con lentejas","carne","c",15,["salchichas","lentejas","frito","cebolla"],["Sofríe la cebolla y las salchichas en rodajas.","Añade tomate frito, pimentón y un poco de agua.","Lentejas escurridas, 5 min."]],
 ["r128","Patatas con chorizo y huevo","carne","c",20,["patatas","chorizo","huevos"],["Patatas en dados al micro 8 min, luego a dorar.","Añade el chorizo en rodajas, 2 min.","Huevo frito encima."]],
 ["r129","Migas exprés con chorizo","carne","c",20,["pan","chorizo","ajo","pimiento"],["Pan del día anterior en dados, humedecido con un poco de agua y sal.","Dora ajo, chorizo y pimiento y sácalos.","Saltea el pan en esa grasa hasta que esté suelto y dorado; mezcla todo."]],
 ["r130","Lomo en adobo con patatas","carne","c",20,["lomo","patatas","ajo","vinagre"],["Adobo: pimentón, orégano, ajo, un chorrito de vinagre y aceite. Marina el lomo 5 min.","Patatas en rodajas al micro 8 min y luego a dorar.","Lomo a la plancha 2 min por lado."]],
 ["r131","Lomo a la naranja","carne","n",15,["lomo","naranja","miel"],["Lomo a la plancha 1-2 min por lado y sácalo.","En la sartén: zumo de 1 naranja y 1 cucharadita de miel, reduce 2 min.","Napa el lomo con la salsa."]],
 ["r132","Picadillo de carne con patatas y guisantes","carne","c",20,["picada","patatas","guisantes","cebolla"],["Patatas en dados pequeños al micro 7 min.","Dora cebolla y carne con comino y pimentón.","Añade patatas y guisantes, 5 min."]],
 ["r133","Pimientos rellenos de carne al micro","carne","c",20,["pimiento","picada","arroz","frito"],["Dora la carne y mézclala con arroz cocido (de ayer) y tomate frito.","Rellena los pimientos sin semillas.","Micro tapado 8-10 min."]],
 ["r134","Calabacines rellenos de carne","carne","n",20,["calabacin","picada","frito","rallado"],["Calabacín partido a lo largo, vaciado, al micro 5 min.","Dora la carne con la pulpa picada y el tomate.","Rellena, queso por encima y gratina 5 min."]],
 ["r135","Tostadas mexicanas de carne picada","carne","n",15,["tortillas","picada","queso","tomate","aguacate"],["Tuesta las tortillas en la sartén hasta que estén crujientes.","Dora la carne con comino y pimentón.","Encima: carne, queso, tomate y aguacate."]],
 ["r136","Bocadillo de lomo con pimientos","carne","cn",15,["pan","lomo","pimiento"],["Pimiento en tiras a fuego medio 8 min.","Lomo fino a la plancha.","Monta en el pan con un chorrito de aceite."]],
 ["r137","Secreto con ensalada de naranja","carne","n",15,["secreto","naranja","lechuga","cebolla"],["Secreto a la plancha muy caliente 3 min por lado, sal gorda.","Naranja pelada en rodajas y cebolla fina.","Ensalada con lechuga, aceite y sal."]],
 ["r138","Ensalada de espinacas, bacon y champiñones","carne","n",10,["espinacas","bacon","champis","frutos_secos"],["Dora el bacon en tiras y sácalo.","Saltea los champiñones en esa grasa.","Mezcla sobre las espinacas crudas con los frutos secos y un chorrito de vinagre."]],
 ["r139","Coliflor gratinada con bacon","carne","n",20,["coliflor","bacon","rallado"],["Coliflor en ramilletes al micro 6 min.","Dora el bacon.","Mezcla, queso por encima y gratina 5 min."]],
 ["r140","Hamburguesa completa con huevo y bacon","carne","c",15,["hamburguesas","huevos","bacon","pan"],["Hamburguesa a la plancha 3-4 min por lado.","Dora el bacon y fríe un huevo.","Monta todo en el pan."]],
 ["r141","Pavo con alcachofas","carne","n",15,["pavo","alcachofas","ajo"],["Pavo en tacos dorado con ajo.","Añade las alcachofas (de bote) partidas.","Saltea 3 min con un chorrito de limón o vino."]],
 ["r142","Brochetas de lomo y pimiento","carne","n",20,["lomo","pimiento","cebolla","limon"],["Lomo en dados con pimentón, ajo en polvo y limón.","Ensarta con pimiento y cebolla.","Plancha 8-10 min dándoles la vuelta."]],
 ["r143","Sándwich de pavo y aguacate","carne","n",10,["pan_molde","fiambre","aguacate","tomate"],["Tuesta el pan.","Aplasta el aguacate con sal y limón.","Monta con pavo y tomate."]],
 ["r144","Bol de carne picada a la coreana","carne","c",20,["picada","soja","jengibre","arroz","pepino"],["Cuece el arroz.","Dora la carne con jengibre, ajo y soja hasta que quede tostada.","Sirve sobre el arroz con pepino en rodajas."]],
 ["r145","Filete a la pimienta con patatas fritas","carne","c",20,["ternera","nata","patatas_fritas"],["Patatas al horno o freidora según el paquete.","Filete con pimienta molida gruesa, a la plancha 2 min por lado.","En la sartén: nata y más pimienta, 2 min, y napa la carne."]],
 ["r146","Pavo al limón con arroz y judías","carne","c",20,["pavo","limon","arroz","judias"],["Cuece el arroz con las judías los últimos 5 min.","Dora el pavo en tacos.","Riega con limón y sirve junto."]],
 ["r147","Salchichas con puré de patata","carne","cn",20,["salchichas","patatas","leche","mantequilla"],["Patatas peladas en dados al micro 10 min.","Aplástalas con mantequilla, leche y sal.","Dora las salchichas y sirve sobre el puré."]],
 ["r148","Lomo con berenjena a la plancha","carne","n",15,["lomo","berenjena","tomate"],["Berenjena en rodajas finas a la plancha con sal.","Lomo a la plancha 1-2 min por lado.","Sirve con tomate en rodajas."]],
 ["r149","Boniato relleno de carne picada","carne","c",20,["boniato","picada","frito","queso"],["Boniato pinchado al micro 8-10 min.","Dora la carne con tomate frito y comino.","Abre el boniato, rellena y queso por encima."]],
 ["r150","Hojaldre de jamón y queso","carne","n",20,["hojaldre","jamon","queso","huevos"],["Horno a 200 °C.","Extiende el hojaldre, cubre media con jamón y queso y dóblalo.","Pinta con huevo batido y hornea 15 min."]],
 ["r151","Pizza de jamón y champiñones","carne","n",20,["masa_pizza","frito","mozza","jamon","champis"],["Horno a 220 °C.","Extiende la masa y pinta con tomate.","Mozzarella, jamón y champiñones; hornea 12 min."]],
 ["r152","Patatas a lo pobre con lomo","carne","c",20,["patatas","pimiento","cebolla","lomo"],["Patata en láminas al micro 8 min con aceite y sal.","Pocha cebolla y pimiento, añade la patata y dora.","Lomo a la plancha encima."]],
 ["r153","Patatas rellenas de queso y bacon","carne","n",15,["patatas","queso","bacon","cebolleta"],["Patatas pinchadas al micro 8-10 min.","Dora el bacon picado.","Abre las patatas, queso, bacon y cebolleta; gratina 3 min."]],
 ["r154","Pan con tomate y jamón","carne","n",5,["pan","tomate","jamon"],["Tuesta el pan.","Frota con tomate maduro, aceite y sal.","Jamón por encima."]],
 ["r155","Lomo saltado","carne","c",20,["ternera","cebolla","tomate","soja","patatas_fritas","arroz"],["Cuece el arroz y haz las patatas según el paquete.","Ternera en tiras a fuego muy fuerte, luego cebolla y tomate en gajos.","Chorro de soja, mezcla con las patatas y sirve con el arroz."]],
 // Huevo
 ["r156","Huevos a la flamenca exprés","huevo","c",20,["huevos","frito","guisantes","chorizo","jamon"],["Sofríe chorizo y jamón en taquitos.","Añade tomate frito y guisantes, 3 min, y pásalo a una cazuelita o sartén pequeña.","Casca los huevos encima y tapa 5 min hasta que cuaje la clara."]],
 ["r157","Revuelto de espinacas y queso fresco","huevo","n",10,["huevos","espinacas","ajo","qfresco"],["Saltea las espinacas con ajo.","Añade los huevos batidos.","Remueve a fuego suave y termina con el queso fresco en dados."]],
 ["r158","Tortilla de atún y tomate","huevo","n",10,["huevos","atun","frito"],["Bate 3 huevos con el atún escurrido.","Cuaja la tortilla en la sartén.","Sirve con tomate frito caliente por encima."]],
 ["r159","Tortilla de champiñones y queso","huevo","n",10,["huevos","champis","queso"],["Saltea los champiñones laminados.","Añade los huevos batidos.","Queso en el centro, dobla y deja que se funda."]],
 ["r160","Huevos rellenos de atún","huevo","cn",15,["huevos","atun","mayo","lechuga"],["Cuece los huevos 10 min y enfríalos en agua.","Parte por la mitad y mezcla las yemas con atún y mayonesa.","Rellena y sirve sobre lechuga."]],
 ["r161","Frittata de brócoli y queso","huevo","n",15,["huevos","brocoli","rallado","cebolla"],["Brócoli picado al micro 3 min; pocha la cebolla.","Mezcla con 4 huevos batidos y queso.","Cuaja tapado a fuego suave 8 min, sin darle la vuelta."]],
 ["r162","Revuelto de calabacín y gambas","huevo","n",10,["huevos","calabacin","gambas","ajo"],["Saltea el calabacín en dados con ajo.","Añade las gambas peladas, 1 min.","Huevos batidos y remueve hasta que cuajen jugosos."]],
 ["r163","Huevos turcos con yogur","huevo","n",15,["huevos","griego","ajo","pan"],["Mezcla el yogur con ajo rallado y sal, y extiéndelo en el plato.","Escalfa 2 huevos 3 min en agua con vinagre.","Encima del yogur con aceite y pimentón. Con pan."]],
 ["r164","Tostada con huevo en el centro","huevo","n",10,["pan_molde","huevos","queso"],["Haz un agujero en el centro del pan con un vaso.","Dora el pan en la sartén y casca el huevo en el hueco.","Tapa 3 min; queso por encima al final."]],
 ["r165","Tortilla de guisantes y jamón","huevo","cn",15,["huevos","guisantes","jamon","cebolla"],["Pocha la cebolla con el jamón.","Añade los guisantes, 2 min.","Mezcla con los huevos batidos y cuaja por los dos lados."]],
 ["r166","Tortilla de puerro","huevo","n",15,["huevos","puerro","qfresco"],["Puerro en rodajas finas, pochado 6 min.","Mezcla con huevo batido y queso fresco desmenuzado.","Cuaja por los dos lados."]],
 ["r167","Tortilla de berenjena","huevo","n",15,["huevos","berenjena","cebolla"],["Berenjena en dados pequeños y cebolla, pochadas 8 min.","Mezcla con huevo batido.","Cuaja por los dos lados."]],

 ["r169","Tortilla paisana","huevo","c",20,["huevos","verd_cong","patatas","jamon"],["Patata en dados al micro 7 min.","Saltea las verduras con el jamón y la patata.","Mezcla con los huevos y cuaja por los dos lados."]],

// Cantidad sin redondear de cada ingrediente para n raciones; p = ración del día ({carb, prot})
function amounts(r,n,p){
  const x=QX[r.id];
  if(x) return Object.fromEntries(r.ings.filter(k=>x[1][k]!=null).map(k=>[k,x[1][k]*n/x[0]]));
  const base=t=>{ let b=null, bp=9; for(const k of r.ings){ const role=QU[k]?.[3]||""; if(role[0]!==t) continue; if(t==="C"&&k!==r.ings[0]&&(role==="C3"?dishType(r)!=="pan":dishType(r)==="verdura")) continue; if(+role[1]<bp){ bp=+role[1]; b=k; } } return b; };
  // La categoría manda: en un plato de huevo la base es el huevo; en uno de legumbre, la legumbre
  const mp=r.cat==="huevo"&&r.ings.includes("huevos")?"huevos":r.cat==="legumbre"&&r.ings.find(k=>LEG_I.includes(k))||base("P"), mc=base("C"), out={};
  for(const k of r.ings){
    const q=QU[k]; if(!q) continue;
    const [,main,sec=main,role=""]=q;
    const v=k===mp?main*p.prot/P0 : k===mc?main*p.carb/C0 : role==="V"&&k===r.ings[0]?main : sec;
    out[k]=v*n;
  }
  return out;
}
function roundQ(k,v){
  const u=QU[k][0];
  if(u==="g"||u==="ml"){ const s=v<200?5:v<500?10:50; return Math.max(s,Math.round(v/s)*s); }
  if(u==="ud"&&QFRAC.has(k)) return Math.max(.25,Math.round(v*4)/4);
  return Math.max(1,Math.round(v));
}
const FRAC={.25:"¼",.5:"½",.75:"¾"};
function fmtQ(k,v){
  const u=QU[k][0], dec=x=>String(Math.round(x*10)/10).replace(".",",");
  if(u==="g") return v>=1000?dec(v/1000)+" kg":v+" g";
  if(u==="ml") return v>=1000?dec(v/1000)+" l":v+" ml";
  const i=Math.floor(v), f=FRAC[Math.round((v-i)*4)/4]||"", num=i&&f?`${i} ${f}`:f||String(i);
  return u==="ud"?num:`${num} ${UNITS[u][v>1?1:0]}`;
}

function matchIng(name){
  const n=norm(name), keys=Object.keys(ING);

    || keys.find(k=>norm(ING[k][0]).startsWith(n+" ")||[n+"s",n+"es",n.replace(/s$/,""),n.replace(/es$/,"")].includes(k));

function newCustom(name){

function addCustom(name){

/* ---------- Puntuación ---------- */
function score(r, opts={}){
  const haveN=r.ings.filter(has).length, miss=r.ings.filter(k=>!has(k));
  let s=haveN/r.ings.length;
  if(!miss.length) s+=.2;
  const pastaFull = pastaThisWeek()>=S.settings.pastaMax;
  if(r.cat==="pasta") s-= pastaFull? .8 : .15;
  const ds=daysSince(r.id);
  if(ds<3) s-=.6; else if(ds<7) s-=.25;
  const last=S.history[S.history.length-1];
  if(last&&last.cat===r.cat) s-=.12;
  return {s,miss,haveN};
}

function planWeekStart(){return new Date(S.plan.week+"T00:00")}
function ensureWeek(){
  const cur=iso(weekStart());
  if(S.plan.week!==cur){ S.plan.week=cur; S.plan.slots.forEach(s=>{s.rid=null;s.lock=false;s.done=false}); S.plan.must=[]; S.shopDone=[]; }
}
const DL=["L","M","X","J","V","S","D"];
const carbHeavy=r=>r.ings.some(k=>ING[k]?.[1]==="carb");
// Las especiales van a cenas o al fin de semana; el resto, según sean de comida, cena o ambas
const fits=(r,s)=>r.special?(s.meal==="cena"||s.day>=4):r.meal.includes(s.meal==="comida"?"c":"n");
// Mejor hueco libre para una receta «sí o sí»: especiales al finde, platos con hidratos en días de entreno, primero huecos vacíos
function bestSlotFor(r,keep){
  let best=-1,bv=-1e9;
  S.plan.slots.forEach((s,i)=>{
    if(keep.has(i)||!s.on||s.done||!fits(r,s)) return;
    let v=s.rid?0:.3;
    if(r.special) v+=(s.day>=4?1:0)+(s.meal==="cena"?.5:0);
    if(carbHeavy(r)) v+=(S.exercise[s.day]||0)*.2;
    if(v>bv){bv=v;best=i}
  });
  return best;
}
function generate(onlyIdx){
  const slots=S.plan.slots;
  // Huecos que no se tocan en esta pasada: fijados y comidos (o todos menos el que cambias)
  const keep=new Set(slots.map((s,i)=>i).filter(i=>slots[i].rid&&(onlyIdx==null?(slots[i].lock||slots[i].done):i!==onlyIdx)));
  if(onlyIdx==null) for(const rid of S.plan.must){
    if(!REC[rid]||[...keep].some(i=>slots[i].rid===rid)) continue;
    const i=bestSlotFor(REC[rid],keep); if(i>=0){ slots[i].rid=rid; keep.add(i); }
  }
  const used=new Set([...keep].map(i=>slots[i].rid));
  const bought=new Set(); used.forEach(id=>REC[id].ings.forEach(k=>bought.add(k)));
  let pasta=[...keep].filter(i=>!slots[i].done&&REC[slots[i].rid].cat==="pasta").length + pastaThisWeek();
  const order=slots.map((s,i)=>i).filter(i=>slots[i].on&&!slots[i].done&&!keep.has(i)&&(onlyIdx==null||i===onlyIdx));
  const prevRid = onlyIdx!=null ? slots[onlyIdx].rid : null;
  for(const i of order){
    const s=slots[i]; const want=s.meal==="comida"?"c":"n"; const ex=S.exercise[s.day]||0;
    const neighbor=[slots[i-1],slots[i+1]].filter(Boolean).map(x=>x.rid&&REC[x.rid]?.cat);
    const cands=QUICK.filter(r=>r.meal.includes(want)&&!used.has(r.id)&&r.id!==prevRid&&!(r.cat==="pasta"&&pasta>=S.settings.pastaMax));
    let best=null,bs=-1e9;
    for(const r of cands){
      const inf=score(r);
      let v=inf.s + r.ings.filter(k=>bought.has(k)&&!has(k)).length*.12 + Math.random()*.35;
      if(neighbor.includes(r.cat)) v-=.3;
      if(r.cat==="pescado") v-=.1;
      // Días de entreno: más platos con hidratos; días de descanso: más verdura y legumbre
      if(carbHeavy(r)) v+=.05*ex; else if(!ex&&["verdura","legumbre"].includes(dishType(r))) v+=.08;
      if(v>bs){bs=v;best=r}
    }
    s.rid=best?best.id:null;
    if(best){ used.add(best.id); best.ings.forEach(k=>bought.add(k)); if(best.cat==="pasta")pasta++; }
  }
  persist();
}
function toggleMust(rid){
  ensureWeek();
  if(isMust(rid)){ S.plan.must=S.plan.must.filter(x=>x!==rid); persist(); toast("Quitada de las fijas de la semana"); return; }
  S.plan.must.push(rid);
  const slots=S.plan.slots; let msg="Incluida. Entra al generar el menú";
  if(slots.some(s=>s.rid===rid)) msg="Incluida. Ya estaba en tu menú";
  else if(slots.some(s=>s.on&&s.rid)){
    const keep=new Set(slots.map((s,i)=>i).filter(i=>slots[i].lock||slots[i].done||(slots[i].rid&&isMust(slots[i].rid))));
    const i=bestSlotFor(REC[rid],keep);
    if(i>=0){ slots[i].rid=rid; msg=`Incluida: ${DAYS[slots[i].day].toLowerCase()}, ${slots[i].meal}`; }
    else msg="Incluida, pero no queda hueco libre. Quita un fijado o añade una comida";
  }
  persist(); toast(msg);
}

/* Raciones por plato según peso, altura y ejercicio.
   Al día: proteína de 1,4 g/kg en descanso a 2,0 g/kg con intensidad 5; hidratos de 3 a 7 g/kg.
   Si el IMC pasa de 25 se usa un peso ajustado para no inflar las raciones.

  const w=+S.body.w||70, h=(+S.body.h||172)/100, top=25*h*h;

}

// Lo que falta: por ingrediente, de qué platos sale y cuánto suma (v=null si algún plato no tiene cantidad)
function shopList(){
  const need={};
  const add=(k,why,v)=>{ const e=need[k]=need[k]||{why:[],v:0}; e.why.push(why); e.v=v==null||e.v==null?null:e.v+v; };
  S.plan.slots.forEach(s=>{ if(!s.on||!s.rid||s.done) return; const r=REC[s.rid], a=amounts(r,baseServ(r),portion(S.exercise[s.day])); r.ings.forEach(k=>{ if(!has(k)) add(k,r.name,a[k]) }) });
  (S.shopExtra||[]).forEach(x=>{ if(has(x.k)) return; const r=x.rid&&REC[x.rid]; add(x.k,x.why,r?amounts(r,x.n||baseServ(r),todayPortion())[x.k]:null) });
  return need;
}
// Total a comprar: las unidades se redondean hacia arriba (no se compra media cebolla)
function shopQty(k,e){
  const u=QU[k]?.[0]; if(e.v==null||!u||QNOTOT.has(u)) return "";
  return fmtQ(k,u==="g"||u==="ml"?roundQ(k,e.v):Math.ceil(e.v-.01));
}
const shopWhy=e=>[...new Set(e.why)].map(w=>{ const c=e.why.filter(x=>x===w).length; return c>1?`${w} (×${c})`:w; }).join(", ");
const eur=n=>n.toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const mercaUrl=k=>"https://tienda.mercadona.es/search-results?query="+encodeURIComponent(ingName(k).replace(/\s*\(.*\)/,""));
function shopGroups(keys){ const byG={}; keys.forEach(k=>{const g=ING[k][1];(byG[g]=byG[g]||[]).push(k)}); return Object.entries(GROUPS).filter(([g])=>byG[g]).map(([g,label])=>[label,byG[g]]); }
function renderCompra(){
  const need=shopList(), keys=Object.keys(need);
  const priced=keys.filter(k=>S.prices[k]>0), total=priced.reduce((a,k)=>a+S.prices[k],0);
  const item=k=>`<li>

    <div class="price"><input type="number" inputmode="decimal" min="0" step="0.05" id="pr-${k}" data-price="${k}" value="${S.prices[k]||""}" placeholder="€" aria-label="Precio de ${esc(ingName(k))}"><a class="small" href="${mercaUrl(k)}" target="_blank" rel="noopener">Ver en Mercadona</a></div>
  </li>`;
  document.getElementById("view").innerHTML=`
    <section class="block">

      ${keys.length?`<div class="row"><button class="btn primary" data-act="pdf-compra">Descargar PDF</button><button class="btn" data-act="copy">Copiar lista</button></div>
        <div class="total"><div><span class="small">Total estimado</span><b>${eur(total)}</b></div><span class="small">${priced.length} de ${keys.length} productos con precio. Escríbelo una vez y se recuerda.</span></div>`:""}
      ${!keys.length&&!S.plan.slots.some(s=>s.rid)?`<p class="note">Primero genera el menú en <b>Menú semanal</b>, o manda una receta a la compra.</p>`:

function printDoc(html,title){
  const el=document.getElementById("print"), old=document.title;

}

    g.hidden=!!q&&!hit; g.open=q?hit:pgOpen(g.dataset.pg);
  });
  document.getElementById("noRes").hidden=!q||any;
}
// Recetario: filtra tarjetas por nombre sin volver a pintar (así no se pierde el foco del buscador)
let rq="";
function applyRecSearch(){
  const q=norm(rq);
  document.querySelectorAll(".rg").forEach(g=>{
    let n=0; g.querySelectorAll(".card").forEach(c=>{const ok=!q||c.dataset.name.includes(q); c.hidden=!ok; if(ok)n++;});
    g.hidden=!!q&&!n; g.open=q?n>0:rgOpen.has(g.dataset.rg);
  });
  const nr=document.getElementById("recNoRes"); if(nr) nr.hidden=!q||!!document.querySelector(".rg:not([hidden])");
}
document.addEventListener("toggle",e=>{
  const d=e.target.dataset; if(!d) return;
  if(d.pg&&!pq){ const g=d.pg; if(e.target.open!==pgOpen(g)){ pgToggled.has(g)?pgToggled.delete(g):pgToggled.add(g); try{localStorage.setItem("qch-pg",JSON.stringify([...pgToggled]))}catch(_){} } }
  if(d.rg&&!rq){ e.target.open?rgOpen.add(d.rg):rgOpen.delete(d.rg); try{localStorage.setItem("qch-rg",JSON.stringify([...rgOpen]))}catch(_){} }
},true);
document.addEventListener("submit",e=>{
  if(e.target.id==="addIng"){ e.preventDefault(); pq=""; const v=document.getElementById("newIng").value; addCustom(v); render(); document.getElementById("pantry").open=true; return; }
  if(e.target.id==="recipeForm"){ e.preventDefault(); saveRecipe(); return; }
  if(e.target.id==="mustForm"){ e.preventDefault(); const q=norm(document.getElementById("mustIn").value); if(!q) return;
    const r=Object.values(REC).find(x=>x.meal!=="s"&&norm(x.name)===q)||Object.values(REC).find(x=>x.meal!=="s"&&norm(x.name).includes(q));
    if(!r) return toast("No encuentro esa receta");
    if(isMust(r.id)) return toast("Ya está incluida");
    toggleMust(r.id); render(); }
});
function markPlanDone(rid){ const s=S.plan.slots.find(x=>x.rid===rid&&!x.done); if(s) s.done=true; }
async function copyList(){
  const need=shopList(); const ks=Object.keys(need), tot=ks.reduce((a,k)=>a+(S.prices[k]||0),0); const txt="Lista de la compra\n"+ks.map(k=>"- "+ingName(k)+(shopQty(k,need[k])?": "+shopQty(k,need[k]):"")+(S.prices[k]?" ("+eur(S.prices[k])+")":"")).join("\n")+(tot?"\nTotal estimado: "+eur(tot):"");
  try{ await navigator.clipboard.writeText(txt); toast("Lista copiada"); }
  catch(_){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast("Lista copiada")}catch(__){toast("Selecciona y copia a mano")} ta.remove(); }
}

(async()=>{

  claude.use("sample").then(fn=>{ if(fn){ sampleFn=fn; document.querySelectorAll(".aiBlock").forEach(b=>b.hidden=false); } });
  try{

    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbRef=db.doc("data/users/"+id+"/state");
    const snap=await dbRef.get();
    if(snap.exists){ S=upgrade(Object.assign(defaults(),JSON.parse(JSON.stringify(snap.data())))); S.prices=S.prices||{}; S.shopExtra=S.shopExtra||[]; syncCustom(); syncMine(); try{localStorage.setItem("qch-state",JSON.stringify(S))}catch(_){ } render(); setSync("Guardado en tu cuenta"); }
    else if(!S.example){ flush(); } else setSync("Se guardará en tu cuenta al hacer cambios");
  }catch(e){ dbRef=null; }
})();
