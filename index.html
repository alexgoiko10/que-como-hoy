<style>
/* Layout: una columna tipo libreta de cocina; cabecera con resumen semanal, pestañas pegadas arriba, tarjetas de plato en rejilla que se apila en móvil */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --sunk:#E8EDE6; --ink:#18201A; --muted:#5C685E; --line:#D6DDD4;
  --accent:#2C6A3D; --accent-ink:#FFFFFF; --accent-soft:#DDEDE0;
  --warn:#A94F17; --warn-soft:#F7E4D6; --ok:#2C6A3D;
  --c-pollo:#D9A23A; --c-carne:#B8503B; --c-huevo:#E6C84A; --c-legumbre:#8C6A3F; --c-pescado:#3E86B5; --c-pasta:#D9772B; --c-arroz:#9AA3A0; --c-verdura:#4E9A55; --c-postre:#A0527A;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101411; --surface:#182019; --sunk:#141A15; --ink:#E6ECE5; --muted:#9BA79D; --line:#2B352C;
  --accent:#7DC291; --accent-ink:#0C1A10; --accent-soft:#1D3324; --warn:#F0A06A; --warn-soft:#3A2417; --ok:#7DC291; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101411; --surface:#182019; --sunk:#141A15; --ink:#E6ECE5; --muted:#9BA79D; --line:#2B352C;
  --accent:#7DC291; --accent-ink:#0C1A10; --accent-soft:#1D3324; --warn:#F0A06A; --warn-soft:#3A2417; --ok:#7DC291; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.01em}
h2{font-size:20px;font-weight:600}
h3{font-size:16px;font-weight:600;font-family:var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:16px}
.sync{font-size:12px;color:var(--muted)}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
nav.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
section.block{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}

.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* despensa */
.pantry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.pantry summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;list-style:none}
.pantry summary::-webkit-details-marker{display:none}
.pgroups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ ";color:var(--accent)}
.note{font-size:13px;background:var(--accent-soft);border-radius:8px;padding:8px 12px}

/* tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cat i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--dot)}
.ings{display:flex;flex-wrap:wrap;gap:4px}
.ing{font-size:12.5px;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.ing.have{background:var(--accent-soft);color:var(--ink)}
.ing.miss{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.meter{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent)}
.card details summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.card ol{margin:8px 0 0;padding-left:20px;font-size:14px}
.card .foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.tag.new{background:var(--accent-soft);color:var(--accent)}
.ai{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ai input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px}

/* plan */
.plan{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.pday{display:grid;grid-template-columns:78px 1fr 1fr;border-top:1px solid var(--line)}
.pday:first-child{border-top:0}
.pday.today{background:var(--accent-soft)}
.pday .dl{padding:12px;display:flex;flex-direction:column;justify-content:center}
.pday .dl b{font-family:var(--f-display);font-size:17px}
.slot{padding:10px 12px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .sname{font-weight:600;font-size:14.5px}
.slot.off{color:var(--muted)}
.slot.done .sname{text-decoration:line-through;color:var(--muted)}
.slot .acts{display:flex;flex-wrap:wrap;gap:4px}
.ico{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.ico[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:560px){
  .pday{grid-template-columns:1fr 1fr}
  .pday .dl{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:8px;align-items:baseline;padding:8px 12px 0}
  .slot{border-left:0}
  .slot + .slot{border-left:1px solid var(--line)}
}

/* compra */
.shop{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.shop li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
.shop li:first-child{border-top:0}
.shop input[type=checkbox]{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.shop label{flex:1;min-width:0;cursor:pointer}

/* historial */
.hist{display:flex;flex-direction:column;gap:2px}
.hday{padding-block:8px;border-top:1px solid var(--line);display:grid;grid-template-columns:110px 1fr;gap:8px}
.hday .hl{font-weight:600;font-size:14px}
.hent{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar .t span{display:block;height:100%;background:var(--dot)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form input,.form select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;min-width:0}
.form input[type=text]{flex:1 1 200px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.two{grid-template-columns:1fr}.hday{grid-template-columns:1fr}}

.seg{flex-wrap:wrap}
.card select{max-width:100%;min-width:0;flex:1 1 100%}
.tip{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:10px 0 0}
.padd{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.padd input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px}
#addIng input{flex:1}
.rform{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rform .full{grid-column:1/-1}
.rform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.rform label i{font-style:normal;font-weight:400}
.rform label .small{font-weight:400}
.rform input,.rform select,.rform textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;font-weight:400;color:var(--ink)}
.rform textarea{resize:vertical}
@media (max-width:640px){.padd{grid-template-columns:1fr}}
.mchip{display:inline-flex;align-items:center}
.mchip .chip{border-top-right-radius:0;border-bottom-right-radius:0}
.mchip .x{border:1px solid var(--line);border-left:0;background:transparent;color:var(--muted);border-radius:0 999px 999px 0;padding:4px 9px;font-size:13.5px;line-height:1.3}
.nores{margin:10px 0 0}
.subp{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.subp summary{cursor:pointer}
.price{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.price input{width:84px;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums}
.price a{color:var(--accent);white-space:nowrap}
.total{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.total>div{display:flex;flex-direction:column}
.total b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
/* Móvil: pestañas abajo como una app, controles más grandes */
@media (max-width:640px){
  .wrap{padding-block:14px 96px}
  .lg{display:none}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-bottom:0;border-top:1px solid var(--line);background:var(--surface);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:2px;overflow:visible}
  nav.tabs button{padding:10px 2px;font-size:12.5px;border-radius:10px;text-transform:capitalize}
  input,select,textarea{font-size:16px!important}
  .btn.sm{padding:7px 12px}
  .ico{padding:6px 10px;font-size:13px}
  .chip{padding:7px 12px;font-size:14px}
  body .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  header.top{margin-bottom:12px}
}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.slot{transition:border-color .15s}}
</style>

 ["s1","Solomillo a la mostaza y miel con puré","carne","pf",35,["solomillo","mostaza","miel","nata","patatas","mantequilla"],["Cuece las patatas peladas en dados 15 min y haz un puré con mantequilla, sal y un poco de leche.","Sella el solomillo entero por todas las caras (6-8 min) y termínalo 8 min en horno a 200 °C.","En la misma sartén: 1 cucharada de mostaza, 1 de miel y la nata. Reduce 3 min.","Deja reposar la carne 3 min, córtala en medallones y napa con la salsa."],"Sirve el puré con una cuchara formando un óvalo y los medallones encima en abanico."],
 ["s2","Risotto de setas y parmesano","arroz","p",40,["arroz","champis","parmesano","vino","cebolla","mantequilla"],["Calienta 1 litro de caldo (o agua con pastilla) y mantenlo caliente.","Pocha la cebolla muy picada, añade el arroz y nácaralo 2 min. Echa un chorro de vino y deja evaporar.","Añade caldo de cazo en cazo, removiendo, durante 16-18 min. A mitad, las setas salteadas aparte.","Fuera del fuego: mantequilla fría y parmesano. Tapa 2 min y sirve."],"El risotto se sirve al momento y algo caldoso: que al mover el plato haga ola."],
 ["s3","Entrecot con patatas panaderas y Padrón","carne","pf",45,["entrecot","patatas","cebolla","padron"],["Patatas y cebolla en láminas finas al horno 35 min a 190 °C con aceite, sal y un chorrito de vino o agua.","Saca el entrecot de la nevera 20 min antes.","Sartén muy caliente: 2-3 min por lado para punto, sal gorda al final.","Fríe los Padrón a fuego fuerte y sala."],"Corta la carne en tiras al bies sobre una tabla de madera y sirve en el centro de la mesa."],
 ["s4","Pollo asado al limón, ajo y romero","pollo","f",60,["muslos","limon","ajo","patatas","romero"],["Horno a 200 °C. Patatas en gajos en la bandeja con aceite y sal.","Encima los muslos salpimentados, ajos enteros machacados, romero y rodajas de limón.","45-50 min, regando a mitad con el jugo.","Los últimos 5 min con grill para la piel crujiente."],"Haz el doble: lo que sobra te sirve de comida el lunes."],
 ["s5","Salmón al horno con espárragos","pescado","p",25,["salmon","esparragos","limon","mantequilla"],["Horno a 200 °C. Espárragos en la bandeja con aceite y sal.","Salmón encima con sal, pimienta, un trozo de mantequilla y rodajas de limón.","12-14 min.","Termina con un chorrito de limón."],"Un poco de eneldo o perejil picado por encima lo hace de restaurante."],
 ["s6","Lasaña de carne casera","pasta","f",75,["lasana","picada","triturado","cebolla","leche","mantequilla","harina","mozza"],["Boloñesa: cebolla, carne y tomate, 20 min a fuego suave.","Bechamel: 40 g mantequilla, 40 g harina, 500 ml leche, sal y nuez moscada, removiendo 8 min.","Monta capas: bechamel, placas, boloñesa… termina con bechamel y mozzarella.","Horno 25-30 min a 190 °C. Reposa 10 min antes de cortar."],"Da para 4 raciones: cena del finde y tupper."],
 ["s7","Gnocchi con gorgonzola y nueces","pasta","p",20,["gnocchi","gorgonzola","nata","nueces"],["Tuesta las nueces en la sartén en seco y resérvalas.","Funde el gorgonzola con la nata a fuego suave.","Cuece los gnocchi hasta que floten y pásalos a la salsa.","Nueces por encima y pimienta."],"Rúcula fresca por encima para contrastar."],
 ["s8","Tacos al pastor de sartén","carne","pf",35,["lomo","pina","tortillas","cebolla","limon"],["Marina el lomo en tiras finas 15 min con pimentón, comino, orégano, ajo, zumo de piña y sal.","Sartén muy caliente, dora la carne por tandas.","Dora también dados de piña.","Tortillas calientes, carne, piña, cebolla picada y limón."],"Monta una barra de tacos en la mesa y que cada uno se haga los suyos."],
 ["s9","Curry rojo de pollo con coco","pollo","pf",35,["pollo","coco","currorojo","pimiento","arroz"],["Cuece el arroz.","Fríe 1-2 cucharadas de pasta de curry 1 min en aceite.","Añade el pollo, luego la leche de coco y el pimiento. 12 min a fuego suave.","Sal (o soja) y limón al final."],"Sírvelo en bol con el arroz a un lado y lima o cilantro si tienes."],
 ["s10","Carrilleras al vino tinto","carne","f",70,["carrilleras","vino","cebolla","zanahoria","patatas"],["Dora las carrilleras enharinadas y sácalas.","Sofríe cebolla y zanahoria 10 min.","Vuelve la carne, 300 ml de vino, cubre de agua. Olla exprés 35 min (o 2 h a fuego lento).","Tritura la salsa y sirve con patatas fritas o puré."],"Mejor de un día para otro: hazla el sábado y cómela el domingo."],
 ["s11","Hamburguesa gourmet con cabra y cebolla caramelizada","carne","pf",40,["picada","brioche","cebolla","qcabra","rucula"],["Cebolla en juliana a fuego bajo 25 min con una pizca de azúcar.","Forma hamburguesas de 150 g, sal justo antes de cocinar.","Plancha 3 min por lado; rodaja de cabra encima el último minuto, tapado.","Tuesta el brioche y monta con rúcula y cebolla."],"Acompaña con patatas gajo al horno con pimentón."],
 ["s12","Gambas al pil pil","pescado","p",20,["gambas","ajo","guindilla","pan"],["Aceite generoso en cazuela de barro con ajo laminado y guindilla, fuego suave.","Cuando el ajo empiece a dorar, sube el fuego y añade las gambas.","2-3 min, sal y perejil.","Directo a la mesa en la cazuela, con mucho pan."],"Es un buen entrante antes del solomillo o del risotto."],
 ["s13","Pizza casera con masa propia","verdura","f",90,["harina","levadura","triturado","mozza","jamon"],["Masa: 250 g harina, 160 ml agua tibia, 5 g levadura, sal y aceite. Amasa 8 min y deja reposar 1 h.","Estira fina y pinta con tomate.","Mozzarella y lo que te guste.","Horno al máximo (250 °C) 10-12 min en la parte baja."],"Haced cada uno la suya con los ingredientes que queráis."],
 ["s14","Tortilla de patatas de verdad","huevo","f",45,["patatas","huevos","cebolla"],["Patata en láminas y cebolla, confitadas en aceite abundante a fuego medio 25 min.","Escurre y mezcla con 5 huevos batidos y sal. Reposa 5 min.","Cuaja a fuego fuerte 1 min, dale la vuelta, otro minuto.","Jugosa por dentro."],"El reposo con el huevo es lo que la hace jugosa. No te lo saltes."],
 ["s15","Magret de pato con frutos rojos","carne","p",35,["magret","frutosrojos","miel","patatas"],["Haz cortes en rombo en la grasa. Sartén en frío, piel abajo, 10 min a fuego medio.","Vuelta y 3-4 min más. Reposa 5 min.","En la grasa: frutos rojos, 1 cucharada de miel y un chorro de vino. Reduce.","Sirve en láminas con patatas panaderas o puré."],"Punto rosado por dentro: es como mejor está."],
 ["s16","Coulant de chocolate","postre","p",25,["chocolate","mantequilla","huevos","azucar","harina"],["Funde 100 g chocolate y 80 g mantequilla.","Bate 2 huevos con 60 g azúcar, añade el chocolate y 30 g harina.","Reparte en 2 moldes engrasados. Se puede dejar preparado en la nevera.","Horno 200 °C 8-9 min. Desmolda y sirve caliente."],"Hazlo antes de cenar y hornéalo mientras recogéis la mesa."],
 ["s17","Tiramisú exprés","postre","pf",20,["mascarpone","bizcochos","cafe","huevos","azucar","cacao"],["Bate 2 yemas con 50 g azúcar, añade 250 g mascarpone.","Monta las 2 claras a punto de nieve y mézclalas con cuidado.","Moja los bizcochos en café frío y alterna capas con la crema.","Nevera mínimo 3 h y cacao por encima al servir."],"Hazlo en 2 vasos individuales: queda más bonito."],
 ["s18","Pulpo a la gallega con cachelos","pescado","pf",30,["pulpo","patatas"],["Cuece las patatas con piel en rodajas gruesas 15-18 min en agua con sal.","Calienta el pulpo cocido 2 min en esa misma agua.","Córtalo con tijera sobre las patatas.","Sal gorda, pimentón dulce y picante y un buen chorro de aceite."],"Sírvelo en tabla de madera: es como se come en Galicia."],
 ["s19","Costillas al horno con barbacoa","carne","f",90,["costillas","barbacoa","miel","patatas"],["Salpimenta las costillas y envuélvelas en papel de aluminio.","Horno a 160 °C 60 min.","Destapa, píntalas con barbacoa y miel y sube a 220 °C 15 min, pintando otra vez a mitad.","Patatas en gajos en la misma bandeja los últimos 30 min."],"Deben despegarse del hueso solas. Servilletas de sobra."],
 ["s20","Presa ibérica con puré de boniato","carne","p",35,["secreto","boniato","mantequilla","miel","mostaza"],["Boniato en dados cocido 15 min y aplastado con mantequilla, sal y pimienta.","Presa o secreto a la plancha muy caliente 3-4 min por lado, sal gorda.","Salsa: 1 cucharada de miel y 1 de mostaza con un chorrito de agua caliente.","Reposa la carne 3 min y córtala en tiras."],"Una lágrima de salsa en el plato y la carne encima del puré."],
 ["s21","Paella de pollo y verduras","arroz","f",60,["arroz","muslos","judias","pimiento","tomate","caldo"],["Dora bien el pollo troceado en la paellera con sal, 10 min.","Añade judías y pimiento, 5 min, y luego el tomate rallado con pimentón.","Arroz (80 g por persona), 1 min, y caldo caliente (el triple). Fuego fuerte 10 min y suave 8 min, sin remover.","Reposa 5 min tapada con un paño."],"Los últimos 2 min a fuego fuerte para el socarrat: suena a crujir."],
 ["s22","Arroz meloso de gambas","arroz","p",40,["arroz","gambas","cebolla","triturado","caldo","vino"],["Pela las gambas; dora cabezas y cáscaras, añade el caldo y deja 10 min. Cuela.","Sofríe la cebolla, añade el tomate y un chorro de vino.","Arroz, 1 min, y el caldo caliente poco a poco, 18 min.","Las gambas peladas los últimos 2 min."],"Que quede meloso, entre caldoso y seco: recién hecho."],
 ["s23","Bacalao con pisto","pescado","pf",40,["bacalao","pimiento","calabacin","cebolla","triturado"],["Pisto: cebolla, pimiento y calabacín en dados pochados 15 min.","Añade el tomate con una pizca de azúcar, 10 min.","Bacalao en lomos, piel arriba, sobre el pisto. Tapa 8 min a fuego suave.","Un chorrito de aceite crudo al servir."],"Pon el pisto en un aro y el lomo de bacalao encima."],
 ["s24","Pollo tandoori al horno","pollo","f",50,["muslos","yogur","curry","limon","arroz"],["Marina los muslos con yogur, curry, pimentón, ajo, limón y sal (mejor 1 h, mínimo 15 min).","Horno a 220 °C 35-40 min.","Cuece el arroz.","Los últimos 3 min con grill."],"Sírvelo con cebolla roja en aros, lima y una salsa de yogur con pepino."],
 ["s25","Albóndigas caseras en salsa","carne","f",60,["picada","huevos","pan_rallado","cebolla","vino","caldo","patatas"],["Mezcla carne, huevo, pan rallado, ajo, perejil y sal. Forma albóndigas.","Pásalas por harina y dóralas; sácalas.","Sofríe cebolla picada, añade vino y caldo y vuelve las albóndigas 20 min.","Tritura la salsa si la quieres fina. Con patatas fritas."],"Mejor al día siguiente: haz el doble y guarda."],
 ["s26","Fajitas de entrecot con guacamole","carne","pf",35,["entrecot","tortillas","pimiento","cebolla","aguacate","lima"],["Guacamole: aguacate, lima, cebolla picada, sal y cilantro si tienes.","Entrecot a la plancha muy caliente 2 min por lado y reposa.","Saltea pimiento y cebolla en tiras con comino y pimentón.","Carne en tiras finas; que cada uno monte la suya."],"Calienta las tortillas en la sartén en seco justo antes de servir."],
 ["s27","Ramen casero","carne","f",60,["noodles","lomo","huevos","caldo","soja","cebolleta","champis"],["Huevos 6 min 30 s y a agua fría; pélalos y déjalos en soja con agua 30 min.","Caldo con soja, jengibre y ajo, 15 min a fuego suave.","Lomo en tiras finas dorado; champiñones salteados.","Noodles en el bol, caldo caliente, carne, champiñones, huevo partido y cebolleta."],"La yema tiene que quedar líquida: controla el tiempo del huevo."],
 ["s28","Musaka","carne","f",75,["berenjena","picada","triturado","cebolla","leche","mantequilla","harina","rallado"],["Berenjena en rodajas asadas al horno 15 min a 200 °C.","Carne con cebolla y tomate, canela y orégano, 15 min.","Bechamel: 30 g mantequilla, 30 g harina, 400 ml leche.","Capas de berenjena y carne, bechamel y queso. Horno 25 min a 190 °C."],"Reposo de 10 min antes de cortar para que salgan porciones limpias."],
 ["s29","Linguine con gambas al ajillo","pasta","p",25,["pasta","gambas","ajo","cherry","guindilla","vino"],["Cuece la pasta.","Ajo laminado y guindilla en aceite a fuego suave; añade las gambas 1 min.","Chorro de vino blanco y los cherry partidos, 2 min.","Mezcla con la pasta y un poco de agua de cocción; perejil."],"Deja 2 gambas enteras con cabeza para decorar cada plato."],
 ["s30","Croquetas de jamón","carne","f",90,["jamon","leche","harina","mantequilla","huevos","pan_rallado","cebolla"],["Pocha media cebolla muy picada en 70 g de mantequilla; añade el jamón picado.","70 g de harina, 2 min, y 700 ml de leche caliente poco a poco, removiendo 10 min.","Extiende la masa y enfríala en la nevera (mejor de un día para otro).","Forma, pasa por huevo y pan rallado y fríe en aceite muy caliente."],"Congela la mitad sin freír: tendrás croquetas para otro finde."],
 ["s31","Pimientos rellenos de carne al horno","carne","f",60,["pimiento","picada","arroz","cebolla","frito","rallado"],["Cuece el arroz 10 min (queda a medias).","Sofríe cebolla y carne, añade tomate y el arroz.","Rellena los pimientos vaciados y ponles su tapa.","Horno a 190 °C 35 min; queso los últimos 5."],"Hazlos con pimientos de colores: rojos, amarillos y verdes."],
 ["s32","Quiche de bacon y puerro","huevo","f",55,["hojaldre","bacon","puerro","huevos","nata","rallado"],["Forra un molde con la masa y pínchala.","Pocha el puerro y dora el bacon.","Mezcla 3 huevos, 200 ml de nata, queso, sal y nuez moscada; añade puerro y bacon.","Rellena y horno a 180 °C 30-35 min."],"Está buena caliente y fría: sirve para un picnic."],
 ["s33","Crema de calabaza con queso de cabra","verdura","p",40,["calabaza","cebolla","qcabra","nueces","nata"],["Pocha la cebolla y añade la calabaza en dados, 5 min.","Cubre de agua o caldo y cuece 20 min.","Tritura con un chorro de nata.","Sirve con rodajas de rulo de cabra gratinado y nueces."],"Un hilo de miel sobre el queso de cabra lo hace de restaurante."],
 ["s34","Tarta de queso cremosa","postre","f",60,["qcrema","nata","huevos","azucar","harina"],["Horno a 210 °C. Forra un molde con papel de horno arrugado.","Bate 500 g de queso crema, 200 g de azúcar, 4 huevos, 250 ml de nata y 1 cucharada de harina.","Hornea 35-40 min: tiene que quedar dorada por fuera y temblorosa en el centro.","Deja enfriar a temperatura ambiente y luego nevera."],"Mejor al día siguiente. El centro cremoso es lo que la hace especial."],
 ["s35","Brownie de chocolate y nueces","postre","f",40,["chocolate","mantequilla","huevos","azucar","harina","nueces"],["Funde 150 g chocolate con 120 g mantequilla.","Bate 3 huevos con 150 g azúcar y mezcla con el chocolate.","Añade 70 g harina y las nueces troceadas.","Horno a 180 °C 20-25 min: el centro debe quedar algo húmedo."],"Sírvelo templado con una bola de helado de vainilla."],
 ["s36","Torrijas","postre","f",30,["pan","leche","huevos","azucar"],["Infusiona la leche con canela y piel de limón y azúcar, 5 min.","Empapa rebanadas gruesas de pan del día anterior.","Pásalas por huevo batido y fríelas en aceite caliente.","Rebózalas en azúcar con canela."],"Aunque sean de Semana Santa, en otoño con un café saben igual de bien."],
 ["s37","Arroz con leche","postre","f",50,["arroz","leche","azucar","limon"],["1 litro de leche con canela en rama y piel de limón. Que hierva.","Añade 100 g de arroz y cuece 35-40 min a fuego suave, removiendo a menudo.","Los últimos 5 min, 80 g de azúcar.","Enfría y espolvorea canela."],"Sírvelo en cuencos de barro."],
 ["s38","Mousse de chocolate","postre","p",20,["chocolate","huevos","azucar"],["Funde 100 g de chocolate y deja templar.","Mezcla con 3 yemas.","Monta las 3 claras a punto de nieve con 30 g de azúcar e incorpóralas con cuidado.","Reparte en vasos y nevera 3 h."],"Unas escamas de sal por encima: contraste que sorprende."],
 ["s39","Solomillo al whisky","carne","pf",30,["solomillo","ajo","caldo","patatas"],["Patatas fritas en dados o gajos.","Solomillo en medallones, dorado 2 min por lado y sácalo.","Dora 6 ajos laminados, añade un chorro de whisky (o vino), el zumo de medio limón y el caldo; reduce 5 min.","Vuelve la carne 1 min a la salsa."],"Con pan para mojar: la salsa es lo mejor."],
 ["s40","Pollo al ajillo de toda la vida","pollo","f",45,["muslos","ajo","vino","patatas"],["Trocea los muslos pequeños y salpimienta.","Dóralos a fuego medio 15 min con una cabeza de ajos sin pelar, machacados.","Vino blanco y tapa 15 min a fuego suave.","Con patatas fritas o panaderas."],"Tomillo o laurel en la cazuela le dan el toque de casa."]

 ["r2","Pollo a la plancha con ensalada","pollo","cn",15,["pollo","lechuga","tomate","pepino"],["Filetea la pechuga fina y sálala.","Plancha muy caliente, 3 min por lado.","Ensalada con aceite, sal y un chorrito de vinagre."]],

 ["r7","Wrap de pollo y aguacate","pollo","n",10,["pollo","tortillas","aguacate","lechuga","tomate"],["Pollo a la plancha en tiras.","Aplasta el aguacate con sal y limón.","Monta el wrap con todo y enrolla."]],

 ["r10","Noodles con pollo y brócoli","pollo","c",15,["noodles","pollo","soja","brocoli"],["Cuece los noodles 3-4 min.","Saltea pollo y brócoli.","Junta todo con soja y un poco de ajo."]],
 ["r11","Cuscús con pollo y verduras","pollo","c",15,["cuscus","pollo","calabacin","pimiento"],["Cuscús: mismo volumen de agua hirviendo, tapa 5 min.","Saltea pollo y verduras en dados.","Mezcla y aliña con aceite y comino."]],
 ["r12","Arroz tres delicias","arroz","c",20,["arroz","huevos","jamon","guisantes","zanahoria"],["Cuece el arroz (o usa de ayer).","Haz una tortilla fina y córtala en tiras.","Saltea zanahoria, guisantes y jamón, añade arroz y tortilla."]],

 ["r14","Arroz salteado con verduras y huevo","arroz","c",20,["arroz","huevos","calabacin","pimiento"],["Cuece el arroz.","Saltea las verduras en dados.","Añade el arroz y un huevo frito encima."]],
 ["r15","Arroz con carne picada y tomate","carne","c",20,["picada","triturado","cebolla","arroz"],["Cuece el arroz.","Dora la cebolla y la carne.","Añade el tomate, 8 min, y sirve sobre el arroz."]],
 ["r16","Tortilla de patatas exprés","huevo","cn",20,["huevos","patatas","cebolla"],["Patata y cebolla finas al micro 8-10 min con aceite y sal.","Mezcla con los huevos batidos.","Cuaja en la sartén por los dos lados."]],
 ["r17","Revuelto de champiñones y jamón","huevo","n",10,["huevos","champis","jamon"],["Saltea los champiñones laminados.","Añade el jamón 1 min.","Echa los huevos y remueve hasta que cuajen jugosos."]],
 ["r18","Tortilla francesa con ensalada","huevo","n",10,["huevos","lechuga","tomate"],["Bate 2-3 huevos con sal.","Cuaja en sartén caliente y dobla.","Acompaña con ensalada."]],
 ["r19","Shakshuka","huevo","cn",20,["huevos","triturado","pimiento","cebolla","pan"],["Pocha cebolla y pimiento.","Añade el tomate con comino y pimentón, 5 min.","Haz huecos, casca los huevos, tapa 5 min. Con pan."]],
 ["r20","Huevos rotos con jamón","huevo","c",20,["patatas","huevos","jamon"],["Patatas en gajos al micro 8 min y luego a la sartén a dorar.","Fríe los huevos.","Pon todo encima con el jamón y rompe los huevos."]],
 ["r21","Tortilla de calabacín","huevo","n",15,["huevos","calabacin","cebolla"],["Pocha calabacín y cebolla en dados.","Mezcla con huevo batido.","Cuaja por los dos lados."]],
 ["r22","Pisto rápido con huevo","verdura","cn",20,["calabacin","pimiento","triturado","cebolla","huevos"],["Pocha cebolla y pimiento en dados pequeños.","Añade calabacín y luego el tomate, 8 min.","Casca un huevo encima y tapa 3 min."]],
 ["r23","Tostas de aguacate y huevo","huevo","n",10,["pan","aguacate","huevos"],["Tuesta el pan.","Aplasta el aguacate con sal y limón.","Huevo a la plancha o poché encima."]],
 ["r24","Boniato al micro con huevo y espinacas","verdura","n",15,["boniato","huevos","espinacas"],["Boniato pinchado al micro 8-10 min.","Saltea las espinacas con ajo.","Abre el boniato, pon espinacas y un huevo frito."]],

 ["r120","Fajitas de ternera","carne","cn",15,["ternera","tortillas","pimiento","cebolla"],["Corta ternera, pimiento y cebolla en tiras.","Saltea fuerte con comino, pimentón y sal.","Rellena las tortillas calientes."]],
 ["r121","Filete de ternera con ensalada","carne","n",10,["ternera","lechuga","tomate","cebolla"],["Saca el filete 10 min antes de la nevera.","Plancha muy caliente, 1-2 min por lado; sal gorda al final.","Ensalada de lechuga, tomate y cebolla."]],
 ["r122","Pavo al curry con arroz","carne","c",20,["pavo","curry","nata","arroz"],["Cuece el arroz.","Dora el pavo en tacos con curry.","Añade la nata, 4 min, y sirve con el arroz."]],
 ["r123","Pavo a la plancha con puré de boniato","carne","n",20,["pavo","boniato","mantequilla"],["Boniato pelado en dados al micro 8-10 min y aplástalo con mantequilla y sal.","Pavo fino a la plancha.","Sirve juntos con pimienta."]],
 ["r124","Hamburguesa sin pan con calabacín","carne","n",15,["hamburguesas","calabacin","tomate"],["Calabacín en rodajas a la plancha.","Hamburguesa 3-4 min por lado.","Sirve con tomate en rodajas y orégano."]],
 ["r125","Salchichas con pimientos y cebolla","carne","cn",15,["salchichas","pimiento","cebolla"],["Pimiento y cebolla en tiras a fuego medio 8 min.","Añade las salchichas y dóralas.","Un chorrito de agua o vino y 2 min más."]],
 ["r126","Perritos con cebolla crujiente","carne","n",10,["salchichas","pan","ketchup","mostaza","cebolla"],["Dora las salchichas.","Cebolla muy fina frita hasta que esté crujiente.","Monta en el pan con ketchup y mostaza."]],
 ["r127","Salchichas con lentejas","carne","c",15,["salchichas","lentejas","frito","cebolla"],["Sofríe la cebolla y las salchichas en rodajas.","Añade tomate frito, pimentón y un poco de agua.","Lentejas escurridas, 5 min."]],
 ["r128","Patatas con chorizo y huevo","carne","c",20,["patatas","chorizo","huevos"],["Patatas en dados al micro 8 min, luego a dorar.","Añade el chorizo en rodajas, 2 min.","Huevo frito encima."]],
 ["r129","Migas exprés con chorizo","carne","c",20,["pan","chorizo","ajo","pimiento"],["Pan del día anterior en dados, humedecido con un poco de agua y sal.","Dora ajo, chorizo y pimiento y sácalos.","Saltea el pan en esa grasa hasta que esté suelto y dorado; mezcla todo."]],
 ["r130","Lomo en adobo con patatas","carne","c",20,["lomo","patatas","ajo","vinagre"],["Adobo: pimentón, orégano, ajo, un chorrito de vinagre y aceite. Marina el lomo 5 min.","Patatas en rodajas al micro 8 min y luego a dorar.","Lomo a la plancha 2 min por lado."]],
 ["r131","Lomo a la naranja","carne","n",15,["lomo","naranja","miel"],["Lomo a la plancha 1-2 min por lado y sácalo.","En la sartén: zumo de 1 naranja y 1 cucharadita de miel, reduce 2 min.","Napa el lomo con la salsa."]],
 ["r132","Picadillo de carne con patatas y guisantes","carne","c",20,["picada","patatas","guisantes","cebolla"],["Patatas en dados pequeños al micro 7 min.","Dora cebolla y carne con comino y pimentón.","Añade patatas y guisantes, 5 min."]],
 ["r133","Pimientos rellenos de carne al micro","carne","c",20,["pimiento","picada","arroz","frito"],["Dora la carne y mézclala con arroz cocido (de ayer) y tomate frito.","Rellena los pimientos sin semillas.","Micro tapado 8-10 min."]],
 ["r134","Calabacines rellenos de carne","carne","n",20,["calabacin","picada","frito","rallado"],["Calabacín partido a lo largo, vaciado, al micro 5 min.","Dora la carne con la pulpa picada y el tomate.","Rellena, queso por encima y gratina 5 min."]],
 ["r135","Tostadas mexicanas de carne picada","carne","n",15,["tortillas","picada","queso","tomate","aguacate"],["Tuesta las tortillas en la sartén hasta que estén crujientes.","Dora la carne con comino y pimentón.","Encima: carne, queso, tomate y aguacate."]],
 ["r136","Bocadillo de lomo con pimientos","carne","cn",15,["pan","lomo","pimiento"],["Pimiento en tiras a fuego medio 8 min.","Lomo fino a la plancha.","Monta en el pan con un chorrito de aceite."]],
 ["r137","Secreto con ensalada de naranja","carne","n",15,["secreto","naranja","lechuga","cebolla"],["Secreto a la plancha muy caliente 3 min por lado, sal gorda.","Naranja pelada en rodajas y cebolla fina.","Ensalada con lechuga, aceite y sal."]],
 ["r138","Ensalada de espinacas, bacon y champiñones","carne","n",10,["espinacas","bacon","champis","frutos_secos"],["Dora el bacon en tiras y sácalo.","Saltea los champiñones en esa grasa.","Mezcla sobre las espinacas crudas con los frutos secos y un chorrito de vinagre."]],
 ["r139","Coliflor gratinada con bacon","carne","n",20,["coliflor","bacon","rallado"],["Coliflor en ramilletes al micro 6 min.","Dora el bacon.","Mezcla, queso por encima y gratina 5 min."]],
 ["r140","Hamburguesa completa con huevo y bacon","carne","c",15,["hamburguesas","huevos","bacon","pan"],["Hamburguesa a la plancha 3-4 min por lado.","Dora el bacon y fríe un huevo.","Monta todo en el pan."]],
 ["r141","Pavo con alcachofas","carne","n",15,["pavo","alcachofas","ajo"],["Pavo en tacos dorado con ajo.","Añade las alcachofas (de bote) partidas.","Saltea 3 min con un chorrito de limón o vino."]],
 ["r142","Brochetas de lomo y pimiento","carne","n",20,["lomo","pimiento","cebolla","limon"],["Lomo en dados con pimentón, ajo en polvo y limón.","Ensarta con pimiento y cebolla.","Plancha 8-10 min dándoles la vuelta."]],
 ["r143","Sándwich de pavo y aguacate","carne","n",10,["pan_molde","fiambre","aguacate","tomate"],["Tuesta el pan.","Aplasta el aguacate con sal y limón.","Monta con pavo y tomate."]],
 ["r144","Bol de carne picada a la coreana","carne","c",20,["picada","soja","jengibre","arroz","pepino"],["Cuece el arroz.","Dora la carne con jengibre, ajo y soja hasta que quede tostada.","Sirve sobre el arroz con pepino en rodajas."]],
 ["r145","Filete a la pimienta con patatas fritas","carne","c",20,["ternera","nata","patatas_fritas"],["Patatas al horno o freidora según el paquete.","Filete con pimienta molida gruesa, a la plancha 2 min por lado.","En la sartén: nata y más pimienta, 2 min, y napa la carne."]],
 ["r146","Pavo al limón con arroz y judías","carne","c",20,["pavo","limon","arroz","judias"],["Cuece el arroz con las judías los últimos 5 min.","Dora el pavo en tacos.","Riega con limón y sirve junto."]],
 ["r147","Salchichas con puré de patata","carne","cn",20,["salchichas","patatas","leche","mantequilla"],["Patatas peladas en dados al micro 10 min.","Aplástalas con mantequilla, leche y sal.","Dora las salchichas y sirve sobre el puré."]],
 ["r148","Lomo con berenjena a la plancha","carne","n",15,["lomo","berenjena","tomate"],["Berenjena en rodajas finas a la plancha con sal.","Lomo a la plancha 1-2 min por lado.","Sirve con tomate en rodajas."]],
 ["r149","Boniato relleno de carne picada","carne","c",20,["boniato","picada","frito","queso"],["Boniato pinchado al micro 8-10 min.","Dora la carne con tomate frito y comino.","Abre el boniato, rellena y queso por encima."]],
 ["r150","Hojaldre de jamón y queso","carne","n",20,["hojaldre","jamon","queso","huevos"],["Horno a 200 °C.","Extiende el hojaldre, cubre media con jamón y queso y dóblalo.","Pinta con huevo batido y hornea 15 min."]],
 ["r151","Pizza de jamón y champiñones","carne","n",20,["masa_pizza","frito","mozza","jamon","champis"],["Horno a 220 °C.","Extiende la masa y pinta con tomate.","Mozzarella, jamón y champiñones; hornea 12 min."]],
 ["r152","Patatas a lo pobre con lomo","carne","c",20,["patatas","pimiento","cebolla","lomo"],["Patata en láminas al micro 8 min con aceite y sal.","Pocha cebolla y pimiento, añade la patata y dora.","Lomo a la plancha encima."]],
 ["r153","Patatas rellenas de queso y bacon","carne","n",15,["patatas","queso","bacon","cebolleta"],["Patatas pinchadas al micro 8-10 min.","Dora el bacon picado.","Abre las patatas, queso, bacon y cebolleta; gratina 3 min."]],
 ["r154","Pan con tomate y jamón","carne","n",5,["pan","tomate","jamon"],["Tuesta el pan.","Frota con tomate maduro, aceite y sal.","Jamón por encima."]],
 ["r155","Lomo saltado","carne","c",20,["ternera","cebolla","tomate","soja","patatas_fritas","arroz"],["Cuece el arroz y haz las patatas según el paquete.","Ternera en tiras a fuego muy fuerte, luego cebolla y tomate en gajos.","Chorro de soja, mezcla con las patatas y sirve con el arroz."]],
 // Huevo
 ["r156","Huevos a la flamenca exprés","huevo","c",20,["huevos","frito","guisantes","chorizo","jamon"],["Sofríe chorizo y jamón en taquitos.","Añade tomate frito y guisantes, 3 min, y pásalo a una cazuelita o sartén pequeña.","Casca los huevos encima y tapa 5 min hasta que cuaje la clara."]],
 ["r157","Revuelto de espinacas y queso fresco","huevo","n",10,["huevos","espinacas","ajo","qfresco"],["Saltea las espinacas con ajo.","Añade los huevos batidos.","Remueve a fuego suave y termina con el queso fresco en dados."]],
 ["r158","Tortilla de atún y tomate","huevo","n",10,["huevos","atun","frito"],["Bate 3 huevos con el atún escurrido.","Cuaja la tortilla en la sartén.","Sirve con tomate frito caliente por encima."]],
 ["r159","Tortilla de champiñones y queso","huevo","n",10,["huevos","champis","queso"],["Saltea los champiñones laminados.","Añade los huevos batidos.","Queso en el centro, dobla y deja que se funda."]],
 ["r160","Huevos rellenos de atún","huevo","cn",15,["huevos","atun","mayo","lechuga"],["Cuece los huevos 10 min y enfríalos en agua.","Parte por la mitad y mezcla las yemas con atún y mayonesa.","Rellena y sirve sobre lechuga."]],
 ["r161","Frittata de brócoli y queso","huevo","n",15,["huevos","brocoli","rallado","cebolla"],["Brócoli picado al micro 3 min; pocha la cebolla.","Mezcla con 4 huevos batidos y queso.","Cuaja tapado a fuego suave 8 min, sin darle la vuelta."]],
 ["r162","Revuelto de calabacín y gambas","huevo","n",10,["huevos","calabacin","gambas","ajo"],["Saltea el calabacín en dados con ajo.","Añade las gambas peladas, 1 min.","Huevos batidos y remueve hasta que cuajen jugosos."]],
 ["r163","Huevos turcos con yogur","huevo","n",15,["huevos","griego","ajo","pan"],["Mezcla el yogur con ajo rallado y sal, y extiéndelo en el plato.","Escalfa 2 huevos 3 min en agua con vinagre.","Encima del yogur con aceite y pimentón. Con pan."]],
 ["r164","Tostada con huevo en el centro","huevo","n",10,["pan_molde","huevos","queso"],["Haz un agujero en el centro del pan con un vaso.","Dora el pan en la sartén y casca el huevo en el hueco.","Tapa 3 min; queso por encima al final."]],
 ["r165","Tortilla de guisantes y jamón","huevo","cn",15,["huevos","guisantes","jamon","cebolla"],["Pocha la cebolla con el jamón.","Añade los guisantes, 2 min.","Mezcla con los huevos batidos y cuaja por los dos lados."]],
 ["r166","Tortilla de puerro","huevo","n",15,["huevos","puerro","qfresco"],["Puerro en rodajas finas, pochado 6 min.","Mezcla con huevo batido y queso fresco desmenuzado.","Cuaja por los dos lados."]],
 ["r167","Tortilla de berenjena","huevo","n",15,["huevos","berenjena","cebolla"],["Berenjena en dados pequeños y cebolla, pochadas 8 min.","Mezcla con huevo batido.","Cuaja por los dos lados."]],
 ["r168","Revuelto a lo pobre","huevo","c",20,["huevos","patatas","pimiento","cebolla"],["Patata en dados al micro 7 min.","Dora patata, cebolla y pimiento en la sartén.","Añade los huevos y remueve hasta que cuajen."]],
 ["r169","Tortilla paisana","huevo","c",20,["huevos","verd_cong","patatas","jamon"],["Patata en dados al micro 7 min.","Saltea las verduras con el jamón y la patata.","Mezcla con los huevos y cuaja por los dos lados."]],
 ["r170","Huevos benedictinos exprés","huevo","n",15,["pan_molde","huevos","jamon","mayo","limon"],["Salsa rápida: mayonesa con limón y un poco de agua caliente.","Escalfa los huevos 3 min.","Pan tostado, jamón, huevo y salsa por encima."]],
 ["r171","Tortilla de calabaza y feta","huevo","n",15,["huevos","calabaza","feta"],["Calabaza en dados pequeños al micro 5 min y luego a dorar.","Mezcla con huevo batido y feta desmenuzado.","Cuaja por los dos lados."]],
 ["r172","Huevos a la mexicana","huevo","n",10,["huevos","tomate","cebolla","picante","tortillas"],["Sofríe cebolla y tomate picados 3 min.","Añade los huevos y salsa picante y remueve hasta que cuajen.","Sirve con tortillas calientes."]],
 ["r173","Omelette de pavo y espinacas","huevo","n",10,["huevos","fiambre","espinacas","queso"],["Saltea las espinacas.","Cuaja los huevos batidos en la sartén.","Rellena con pavo, espinacas y queso y dobla."]],
 ["r174","Aguacate relleno de huevo al horno","huevo","n",15,["aguacate","huevos","bacon"],["Parte el aguacate y agranda un poco el hueco del hueso.","Casca un huevo en cada mitad con sal y bacon picado.","Horno a 200 °C 12 min."]],
 ["r175","Bocadillo de tortilla y pimientos","huevo","cn",15,["pan","huevos","pimiento"],["Pimiento en tiras a fuego medio 8 min.","Tortilla francesa de 2 huevos.","Monta en el pan."]],
 ["r176","Huevo revuelto con tomate a la china","huevo","c",15,["huevos","tomate","arroz","cebolleta"],["Cuece el arroz.","Revuelto jugoso y sácalo; saltea el tomate en gajos con una pizca de azúcar.","Junta todo con la cebolleta y sirve sobre el arroz."]],
 ["r177","Huevos rotos con chorizo y pimientos","huevo","c",20,["patatas_fritas","huevos","chorizo","pimiento"],["Patatas al horno o freidora según el paquete.","Saltea pimiento y chorizo.","Fríe los huevos, ponlo todo encima y rómpelos."]],
 ["r178","Burrito de huevo y alubias","huevo","n",15,["tortillas","huevos","alubias","queso"],["Calienta las alubias con comino y aplástalas un poco.","Revuelto de huevos.","Rellena la tortilla con todo y queso, enrolla y dórala."]],
 ["r179","Tortilla de alcachofas","huevo","n",15,["huevos","alcachofas","cebolla"],["Alcachofas de bote en cuartos, doradas con la cebolla.","Mezcla con los huevos batidos.","Cuaja por los dos lados."]],
 ["r180","Sopa de ajo con huevo","huevo","n",15,["pan","ajo","huevos","caldo"],["Dora ajo laminado y pan en rebanadas finas con pimentón.","Añade el caldo, 5 min.","Casca los huevos dentro y deja 3 min hasta que cuajen."]],
 ["r181","Tortilla de piquillos y queso fresco","huevo","n",10,["huevos","piquillo","qfresco"],["Piquillos en tiras salteados 1 min.","Mezcla con los huevos batidos y el queso.","Cuaja por los dos lados."]],
 ["r182","Tortitas de avena y plátano con yogur","huevo","n",15,["avena","platano","huevos","griego"],["Tritura 1 plátano, 2 huevos y 5 cucharadas de avena.","Haz tortitas en la sartén a fuego medio, 2 min por lado.","Sirve con yogur griego."]],
 // Legumbre
 ["r183","Garbanzos salteados con gambas","legumbre","c",15,["garbanzos","gambas","ajo","pimiento"],["Saltea el pimiento en dados con ajo.","Añade las gambas y los garbanzos escurridos.","3 min con pimentón y perejil si tienes."]],
 ["r184","Potaje exprés de garbanzos y bacalao","legumbre","c",20,["garbanzos","bacalao","espinacas","cebolla"],["Sofríe la cebolla con pimentón.","Añade los garbanzos y un vaso de agua, 5 min.","Bacalao desmigado y espinacas, 5 min más."]],
 ["r185","Lentejas con arroz y cebolla","legumbre","c",20,["lentejas","arroz","cebolla"],["Cuece el arroz.","Cebolla en juliana a fuego medio hasta dorar bien (10 min) con comino.","Mezcla las lentejas calientes con el arroz y la cebolla por encima."]],
 ["r186","Dal de lentejas exprés","legumbre","c",20,["lentejas","curry","triturado","cebolla","arroz"],["Cuece el arroz.","Pocha la cebolla con curry y ajo.","Añade tomate y lentejas y aplasta un poco, 8 min."]],
 ["r187","Ensalada de lentejas, feta y pepino","legumbre","n",10,["lentejas","feta","pepino","cebolleta"],["Enjuaga las lentejas.","Pica pepino y cebolleta.","Mezcla con feta y aliña con limón y aceite."]],
 ["r188","Alubias con chorizo exprés","legumbre","c",15,["alubias","chorizo","cebolla","frito"],["Sofríe la cebolla y el chorizo en rodajas.","Añade tomate frito y un poco de agua.","Alubias dentro, 5 min."]],
 ["r189","Ensalada de alubias y atún","legumbre","n",10,["alubias","atun","cebolla","pimiento"],["Enjuaga las alubias.","Pica cebolla y pimiento.","Mezcla con el atún y aliña con aceite y vinagre."]],
 ["r190","Alubias con espinacas y huevo","legumbre","c",15,["alubias","espinacas","huevos","ajo"],["Dora ajo con pimentón.","Añade las alubias y las espinacas.","Casca un huevo encima y tapa 4 min."]],
 ["r191","Hummus casero con palitos de verdura","legumbre","n",10,["garbanzos","limon","ajo","zanahoria","pepino"],["Tritura garbanzos con limón, ajo, comino, aceite y un poco de agua.","Corta zanahoria y pepino en palitos.","Sirve con pimentón y un chorro de aceite."]],
 ["r192","Ensalada con garbanzos crujientes","legumbre","n",20,["garbanzos","lechuga","tomate","qfresco"],["Seca los garbanzos y dóralos en la sartén con aceite y pimentón 8 min.","Pica lechuga y tomate.","Mezcla con queso fresco y los garbanzos calientes por encima."]],
 ["r193","Falafel exprés","legumbre","cn",20,["garbanzos","cebolla","perejil","pan_rallado","yogur"],["Tritura garbanzos, cebolla, perejil, comino y 2 cucharadas de pan rallado.","Haz bolitas aplastadas y dóralas en la sartén 3 min por lado.","Sirve con salsa de yogur y limón."]],
 ["r194","Tacos de garbanzos especiados","legumbre","n",15,["garbanzos","tortillas","aguacate","cebolla","lima"],["Saltea los garbanzos con comino, pimentón y picante.","Aplasta el aguacate con lima y sal.","Rellena las tortillas con cebolla picada."]],
 ["r195","Boloñesa de soja texturizada con arroz","legumbre","c",20,["soja_text","triturado","cebolla","zanahoria","arroz"],["Hidrata la soja 10 min en agua caliente y escúrrela.","Sofríe cebolla y zanahoria picadas, añade la soja y el tomate, 8 min.","Sirve con arroz."]],
 ["r196","Tacos de soja texturizada","legumbre","cn",20,["soja_text","tortillas","pimiento","cebolla"],["Hidrata la soja 10 min y escúrrela bien.","Saltea con cebolla, pimiento, comino y pimentón hasta que esté tostada.","Rellena las tortillas."]],
 ["r197","Noodles con edamame","legumbre","c",15,["edamame","noodles","soja","zanahoria"],["Cuece los noodles.","Saltea edamame y zanahoria en tiras.","Mezcla con los noodles y la soja."]],
 ["r198","Ensalada de edamame, maíz y aguacate","legumbre","n",10,["edamame","maiz","aguacate","cherry"],["Edamame al micro 2 min.","Aguacate en dados y cherry partidos.","Mezcla con el maíz y aliña con limón."]],
 ["r199","Wrap de hummus y verduras","legumbre","n",15,["tortillas","hummus","calabacin","pimiento","feta"],["Calabacín y pimiento en tiras a la plancha.","Extiende hummus en la tortilla.","Verduras y feta, y enrolla."]],
 ["r200","Garbanzos con calabaza al curry","legumbre","c",20,["garbanzos","calabaza","curry","cebolla"],["Calabaza en dados al micro 5 min.","Pocha la cebolla con curry.","Añade calabaza, garbanzos y un poco de agua, 8 min."]],
 ["r201","Crema de lentejas y zanahoria","legumbre","n",15,["lentejas","zanahoria","cebolla","caldo"],["Pocha cebolla y zanahoria picadas 5 min.","Añade las lentejas y el caldo, 8 min.","Tritura y sirve con aceite y pimentón."]],
 ["r202","Arroz con alubias y huevo","legumbre","c",20,["arroz","alubias","huevos","cebolla"],["Cuece el arroz.","Sofríe la cebolla con comino y añade las alubias.","Mezcla con el arroz y huevo frito encima."]],
 ["r203","Empedrat de alubias y bacalao","legumbre","cn",15,["alubias","bacalao","tomate","cebolla","aceitunas"],["Desmiga el bacalao.","Pica tomate y cebolla.","Mezcla con las alubias y las aceitunas; aliña con aceite y vinagre."]],
 ["r204","Pisto con garbanzos","legumbre","c",20,["garbanzos","calabacin","pimiento","triturado"],["Pocha pimiento y calabacín en dados.","Añade el tomate, 6 min.","Garbanzos dentro, 4 min más."]],
 ["r205","Lentejas salteadas con champiñones","legumbre","n",15,["lentejas","champis","espinacas","ajo"],["Saltea los champiñones con ajo.","Añade las lentejas escurridas.","Espinacas hasta que bajen, sal y pimentón."]],
 ["r206","Sopa de fideos con garbanzos y huevo","legumbre","n",15,["caldo","fideos","garbanzos","huevos"],["Cuece un huevo 10 min.","Calienta el caldo con los garbanzos y echa los fideos, 4 min.","Sirve con el huevo picado por encima."]],
 // Verdura
 ["r207","Tofu revuelto con verduras","verdura","n",10,["tofu","espinacas","cebolla","pimiento"],["Pocha cebolla y pimiento.","Desmiga el tofu con las manos y añádelo con cúrcuma o curry y sal.","Espinacas al final hasta que bajen."]],
 ["r208","Tofu crujiente agridulce con arroz","verdura","c",20,["tofu","soja","miel","arroz","pimiento"],["Cuece el arroz.","Tofu en dados bien secos, dorado a fuego fuerte.","Añade el pimiento, soja y miel, y reduce 1 min."]],

let QUICK = [];
// Recetas propias: viven en S.myRecipes y se mezclan con el recetario fijo en REC
function syncMine(){
  for(const id of Object.keys(REC)) if(REC[id].mine) delete REC[id];
  S.myRecipes=S.myRecipes||[];
  for(const r of S.myRecipes) REC[r.id]=Object.assign({steps:[]},r,{mine:true});
  QUICK=Object.values(REC).filter(r=>!r.special);
  S.plan.slots.forEach(s=>{ if(s.rid&&!REC[s.rid]){ s.rid=null; s.lock=false; } });
}

const pad = n=>String(n).padStart(2,"0");
const iso = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const weekStart = (d=new Date())=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const todayIso = ()=>iso(new Date());
function defaults(){
  const slots=[];
  for(let i=0;i<7;i++){ slots.push({day:i,meal:"comida",on:i<4,rid:null,lock:false,done:false}); slots.push({day:i,meal:"cena",on:true,rid:null,lock:false,done:false}); }
  return {v:1, example:true, pantry:["huevos","arroz","pasta","cebolla","ajo","frito","atun","patatas","pollo","lechuga","tomate","garbanzos"], history:[], plan:{week:iso(weekStart()), slots}, shopDone:[], shopExtra:[], prices:{}, custom:[], myRecipes:[], settings:{pastaMax:1}};
}

let dbRef=null, writing=false, pending=false, timer=null;
function persist(){
  S.example=false;
  try{localStorage.setItem("qch-state",JSON.stringify(S))}catch(e){}
  clearTimeout(timer); timer=setTimeout(flush,700);
}
async function flush(){
  if(!dbRef) return;
  if(writing){pending=true;return}
  writing=true;
  try{ await dbRef.set(JSON.parse(JSON.stringify(S))); setSync("Guardado en tu cuenta"); }
  catch(e){ setSync("No se pudo guardar en tu cuenta; queda en este navegador"); }
  writing=false;
  if(pending){pending=false;flush()}
}

/* ---------- Utilidades ---------- */
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has = k=>S.pantry.includes(k);
const ingName = k=>ING[k]?ING[k][0]:k;
const norm = t=>String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
function syncCustom(){ S.custom=S.custom||[]; for(const c of S.custom) ING[c.k]=[c.n,"mine"]; }
// Busca un ingrediente de la lista por nombre ("pollo", "huevo", "Nata para cocinar"…)
function matchIng(name){
  const n=norm(name), keys=Object.keys(ING);
  return keys.find(k=>k===n||norm(ING[k][0])===n)
    || keys.find(k=>norm(ING[k][0]).startsWith(n+" ")||[n+"s",n+"es",n.replace(/s$/,""),n.replace(/es$/,"")].includes(k));
}
function newCustom(name){
  const k="x_"+norm(name).replace(/[^a-z0-9]+/g,"_").slice(0,40);
  if(!S.custom.some(c=>c.k===k)) S.custom.push({k,n:name.charAt(0).toUpperCase()+name.slice(1)});
  syncCustom(); return k;
}
function addCustom(name){
  name=name.trim().replace(/\s+/g," "); if(!name) return;
  const hit=matchIng(name);
  if(hit){ if(!has(hit)) S.pantry.push(hit); persist(); toast(`${ING[hit][0]} marcado`); return; }
  const k=newCustom(name); if(!has(k)) S.pantry.push(k); persist(); toast(`${name} añadido`);
}
function removeCustom(k){
  const used=(S.myRecipes||[]).find(r=>r.ings.includes(k));
  if(used){ toast(`Lo usa tu receta «${used.name}»`); return; }
  S.custom=S.custom.filter(c=>c.k!==k); S.pantry=S.pantry.filter(x=>x!==k); delete ING[k]; persist();
}
const catDot = c=>`<span class="cat" style="--dot:var(--c-${CATS[c]?c:"verdura"})"><i></i>${esc(CATS[c]||c)}</span>`;
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}
function thisWeekHistory(){const ws=iso(weekStart());return S.history.filter(h=>h.d>=ws)}
function pastaThisWeek(){return thisWeekHistory().filter(h=>h.cat==="pasta").length}
function daysSince(rid,name){
  const h=S.history.filter(x=>(rid&&x.rid===rid)||(!rid&&x.name===name)).map(x=>x.d).sort().pop();
  if(!h) return Infinity;
  return Math.round((new Date(todayIso())-new Date(h))/864e5);
}
function logMeal(entry){
  S.history.push(Object.assign({d:todayIso(),meal:mealNow},entry));
  S.history.sort((a,b)=>a.d.localeCompare(b.d));
  if(S.history.length>400) S.history=S.history.slice(-400);
  persist();
}
let mealNow = new Date().getHours()<17?"comida":"cena";
let tab="hoy";

/* ---------- Puntuación ---------- */
function score(r, opts={}){
  const haveN=r.ings.filter(has).length, miss=r.ings.filter(k=>!has(k));
  let s=haveN/r.ings.length;
  if(!miss.length) s+=.2;
  const pastaFull = pastaThisWeek()>=S.settings.pastaMax;
  if(r.cat==="pasta") s-= pastaFull? .8 : .15;
  const ds=daysSince(r.id);
  if(ds<3) s-=.6; else if(ds<7) s-=.25;
  const last=S.history[S.history.length-1];
  if(last&&last.cat===r.cat) s-=.12;
  return {s,miss,haveN};
}

function fmtDate(d){const t=todayIso();if(d===t)return"Hoy";if(d===iso(addDays(new Date(),-1)))return"Ayer";const x=new Date(d+"T12:00");return x.toLocaleDateString("es-ES",{weekday:"short",day:"numeric",month:"short"})}

/* ---------- Tarjeta de receta ---------- */
function card(r,info,actions){
  const pct=Math.round(info.haveN/r.ings.length*100);
  const ds=daysSince(r.id);
  const tags=[];
  if(r.cat==="pasta"&&pastaThisWeek()>=S.settings.pastaMax) tags.push(`<span class="tag">Ya llevas tu pasta</span>`);
  if(ds===Infinity&&r.cat!=="pasta") tags.push(`<span class="tag new">Nuevo para ti</span>`);
  else if(ds<7) tags.push(`<span class="tag">Hace ${ds} día${ds===1?"":"s"}</span>`);
  return `<article class="card">
    <div class="row between"><h3>${esc(r.name)}</h3></div>
    <div class="meta">${catDot(r.cat)}<span>${r.min} min</span><span>${r.special?occLabel(r.occ):r.meal==="c"?"Comida":r.meal==="n"?"Cena":"Comida o cena"}</span>${r.mine?`<span class="tag new">Tuya</span>`:""}${tags.join("")}</div>
    <div class="meter" title="Tienes ${pct}% de los ingredientes"><span style="width:${pct}%"></span></div>
    <div class="ings">${r.ings.map(k=>`<span class="ing ${has(k)?"have":"miss"}">${esc(ingName(k))}</span>`).join("")}</div>
    ${r.steps.length||r.tip?`<details><summary>Cómo se hace</summary>${r.steps.length?`<ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:""}${r.tip?`<p class="tip"><b>Para quedar bien:</b> ${esc(r.tip)}</p>`:""}</details>`:""}
    <div class="foot"><span class="small muted">${info.miss.length?"Te falta: "+esc(info.miss.map(ingName).join(", ")):"Lo tienes todo"}</span>${actions}</div>
  </article>`;
}

${ask?"Además, pide: "+ask:""}

[{${shape},"truco":"un detalle de emplatado o de servir para quedar bien"}]`;

Requisitos: 20 minutos o menos, ingredientes baratos de supermercado, buena proteína, poco pescado (como mucho una opción con pescado). ${pastaFull?"NO propongas pasta: ya ha llegado a su límite semanal.":"Evita la pasta; como mucho una opción."}
Que los 4 sean de tipos distintos entre sí.
Tiene en casa: ${pantry}. Siempre tiene aceite, sal, pimienta y especias básicas.
Ha comido recientemente: ${recent}. No repitas esos platos.
Usa sobre todo lo que tiene; como mucho 2 ingredientes que comprar por plato.
${ask?"Además, pide: "+ask:""}
Responde solo con un array JSON de 4 objetos con esta forma:
[{${shape}}]`;
}
async function askAI(kind){
  if(!sampleFn) return;
  const a=aiAll[kind];
  a.ask=document.getElementById("aiAsk-"+kind)?.value||"";
  aiCtl=new AbortController();
  a.loading=true; a.err=null; render();
  try{
    const res=await sampleFn.json(promptFor(kind,a.ask),{signal:aiCtl.signal,cache:false});
    a.items=Array.isArray(res)?res.filter(x=>x&&x.nombre).slice(0,6):null;
    if(!a.items||!a.items.length) a.err="La respuesta no trajo platos. Prueba otra vez.";
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled"){}
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){sampleFn=null}
    else if(c==="rate_limited") a.err="Has pedido muchas ideas seguidas. Espera un poco y vuelve a probar.";
    else if(c==="invalid_json") a.err="La respuesta vino en un formato raro. Pulsa otra vez.";
    else a.err="No se pudo contactar con Claude. Inténtalo de nuevo.";
  }
  a.loading=false; render();
}

function saveRecipe(){
  const g=id=>document.getElementById(id).value;
  const name=g("rfName").trim().replace(/\s+/g," ");
  if(!name) return toast("Ponle un nombre");
  const raw=g("rfIngs").split(/[,;\n]+/).map(x=>x.trim().replace(/\s+/g," ")).filter(Boolean);
  if(!raw.length) return toast("Añade al menos un ingrediente");
  const ings=[...new Set(raw.map(x=>matchIng(x)||newCustom(x)))];
  const kind=g("rfKind"), tip=g("rfTip").trim();
  const r={id:editId||"m"+Date.now().toString(36), name, cat:g("rfCat"), meal:kind==="sp"?"cn":kind,
    min:Math.min(600,Math.max(1,Math.round(+g("rfMin")||20))), ings, steps:g("rfSteps").split("\n").map(x=>x.trim()).filter(Boolean)};
  if(kind==="sp"){ r.special=true; r.occ="pf"; }

  const i=S.myRecipes.findIndex(x=>x.id===r.id);
  if(i>=0) S.myRecipes[i]=r; else S.myRecipes.push(r);
  toast(i>=0?"Receta guardada":`${name} añadida a tus recetas`);
  editId=null; formOpen=false; syncMine(); persist(); render();
}

/* ---------- Pestaña SEMANA ---------- */
function planWeekStart(){return new Date(S.plan.week+"T00:00")}
function ensureWeek(){
  const cur=iso(weekStart());
  if(S.plan.week!==cur){ S.plan.week=cur; S.plan.slots.forEach(s=>{s.rid=null;s.lock=false;s.done=false}); S.shopDone=[]; }
}
function generate(onlyIdx){
  const used=new Set(S.plan.slots.filter((s,i)=>s.rid&&(onlyIdx==null?s.lock:i!==onlyIdx)).map(s=>s.rid));
  const bought=new Set(); S.plan.slots.forEach((s,i)=>{if(s.rid&&used.has(s.rid))REC[s.rid].ings.forEach(k=>bought.add(k))});
  let pasta=[...used].filter(id=>REC[id].cat==="pasta").length + pastaThisWeek();
  const order=S.plan.slots.map((s,i)=>i).filter(i=>{const s=S.plan.slots[i];return s.on&&!s.done&&(onlyIdx==null?!s.lock:i===onlyIdx)});
  const prevRid = onlyIdx!=null ? S.plan.slots[onlyIdx].rid : null;
  for(const i of order){
    const s=S.plan.slots[i]; const want=s.meal==="comida"?"c":"n";
    const neighbor=[S.plan.slots[i-1],S.plan.slots[i+1]].filter(Boolean).map(x=>x.rid&&REC[x.rid]?.cat);
    const cands=QUICK.filter(r=>r.meal.includes(want)&&!used.has(r.id)&&r.id!==prevRid&&!(r.cat==="pasta"&&pasta>=S.settings.pastaMax));
    let best=null,bs=-1e9;
    for(const r of cands){
      const inf=score(r);
      let v=inf.s + r.ings.filter(k=>bought.has(k)&&!has(k)).length*.12 + Math.random()*.35;
      if(neighbor.includes(r.cat)) v-=.3;
      if(r.cat==="pescado") v-=.1;
      if(v>bs){bs=v;best=r}
    }
    if(best){ s.rid=best.id; used.add(best.id); best.ings.forEach(k=>bought.add(k)); if(best.cat==="pasta")pasta++; }
  }
  persist();
}
function renderSemana(){
  ensureWeek();
  const ws=planWeekStart(), t=todayIso();
  const empty=!S.plan.slots.some(s=>s.on&&s.rid);
  const slot=(s,i)=>{
    const lbl=`<span class="label">${s.meal==="comida"?"Comida":"Cena"}</span>`;
    if(!s.on) return `<div class="slot off">${lbl}<button class="ico" data-slot-on="${i}">+ Añadir</button></div>`;
    const r=s.rid&&REC[s.rid];
    return `<div class="slot ${s.done?"done":""}">${lbl}
      <div class="sname">${r?esc(r.name):'<span class="muted">Sin plato</span>'}</div>
      ${r?`<div class="meta small">${catDot(r.cat)} <span class="muted">${r.min} min</span></div>`:""}
      <div class="acts">
        ${r&&!s.done?`<button class="ico" data-slot-done="${i}" title="Marcar como comido">✓ Comido</button>`:""}
        ${!s.done?`<button class="ico" data-slot-swap="${i}" title="Otro plato">↻ Cambiar</button><button class="ico" data-slot-lock="${i}" aria-pressed="${s.lock}" title="Fijar este plato">${s.lock?"Fijado":"Fijar"}</button>`:""}
        ${!s.done?`<button class="ico" data-slot-off="${i}" title="No cocino aquí">Quitar</button>`:""}
      </div></div>`;
  };
  const rows=[0,1,2,3,4,5,6].map(d=>{
    const date=addDays(ws,d);
    const ci=d*2, ni=d*2+1;
    return `<div class="pday ${iso(date)===t?"today":""}"><div class="dl"><b>${DAYS[d].slice(0,3)}</b><span class="small muted">${date.getDate()}/${date.getMonth()+1}</span></div>${slot(S.plan.slots[ci],ci)}${slot(S.plan.slots[ni],ni)}</div>`;
  }).join("");
  const on=S.plan.slots.filter(s=>s.on).length;
  document.getElementById("view").innerHTML=`
    <section class="block">
      <div class="row between">
        <div><h2>Semana del ${ws.getDate()}/${ws.getMonth()+1}</h2><p class="small muted" style="margin:2px 0 0">${on} comidas a cocinar · máximo ${S.settings.pastaMax} de pasta · prioriza lo que tienes y reaprovecha lo que compras</p></div>
        <div class="row">
          <label class="small muted" for="pastaMax">Pasta por semana</label>
          <select id="pastaMax" class="btn sm">${[0,1,2,3].map(n=>`<option value="${n}" ${n===S.settings.pastaMax?"selected":""}>${n}</option>`).join("")}</select>
          <button class="btn primary" data-act="gen">${empty?"Generar semana":"Regenerar lo no fijado"}</button>
        </div>
      </div>
      ${empty?`<p class="note">Pulsa <b>Generar semana</b>. Por defecto cocinas comida de lunes a jueves y cena todos los días; usa <b>Quitar</b> o <b>+ Añadir</b> para ajustarlo.</p>`:""}
      <div class="plan">${rows}</div>
    </section>`;
}
